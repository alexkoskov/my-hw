# Hot Wheels news bot — production runtime, routed through the SHARED VPN gateway
# (Telegram/Telegra.ph are filtered from the RU host). The single app container
# joins the external `vpnnet` bridge, points its default route at the sing-box
# gateway (172.28.0.2), and only then starts Python.
#
# Files placed alongside this compose on the host (NOT in git — host-side):
#   .env          bot secrets (copied from the old NL server) + DB_FILE=/data/news.db
#   ./data/news.db   persistent DB copied from the old server (anti-spam: keeps
#                    processed_news so the channel isn't flooded with old posts)
#
# Prereq: the shared-vpn stack (/root/shared-vpn) must be UP first — it owns
# `vpnnet` and the gateway container at 172.28.0.2.

networks:
  vpnnet:
    external: true

services:
  news-bot:
    build: .
    image: hw-news-bot:latest
    container_name: hw-news-bot
    restart: unless-stopped
    # NET_ADMIN is needed only to replace this container's default route before
    # Python starts. No ports published — the bot is outbound-only.
    cap_add:
      - NET_ADMIN
    command: ["sh", "-c", "ip route replace default via 172.28.0.2 && echo 'default route -> 172.28.0.2 (shared VPN gateway)' && exec python3 news_bot.py"]
    networks:
      - vpnnet
    env_file:
      - .env
    environment:
      # Heartbeat marker on the mounted volume (B5) — persistent across restarts
      # and readable by `docker exec hw-news-bot /app/watchdog.sh` (host cron).
      - HEARTBEAT_FILE=/data/last_tick.ts
    volumes:
      # Persistent DB (DB_FILE=/data/news.db in .env) + heartbeat. Survives
      # container recreation on redeploy — do NOT bake news.db into the image.
      - ./data:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
