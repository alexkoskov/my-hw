name: Deploy production

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  select:
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.gate.outputs.deploy }}
      sha: ${{ steps.gate.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - name: Verify exact main revision and successful test job
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/deploy_production.py gate

  deploy:
    needs: select
    if: needs.select.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    outputs:
      sha: ${{ needs.select.outputs.sha }}
    env:
      DEPLOY_SHA: ${{ needs.select.outputs.sha }}
      PROD_HOST: 45.90.216.165
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.select.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Configure production SSH identity
        env:
          PROD_SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          PROD_SSH_KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          if [ -z "$PROD_SSH_PRIVATE_KEY" ] || [ -z "$PROD_SSH_KNOWN_HOSTS" ]; then
            echo '::error::Configure PROD_SSH_PRIVATE_KEY and PROD_SSH_KNOWN_HOSTS for the Moscow production host. Legacy SSH_* secrets are not used.'
            exit 1
          fi
          umask 077
          mkdir -p "$RUNNER_TEMP/prod-ssh"
          printf '%s\n' "$PROD_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/prod-ssh/key"
          printf '%s\n' "$PROD_SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/prod-ssh/known_hosts"
          ssh-keygen -y -P '' -f "$RUNNER_TEMP/prod-ssh/key" > "$RUNNER_TEMP/prod-ssh/recipient"
          grep -qE '^(ssh-ed25519|ssh-rsa) ' "$RUNNER_TEMP/prod-ssh/recipient"
          ssh-keygen -F "$PROD_HOST" -f "$RUNNER_TEMP/prod-ssh/known_hosts" >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends age
      - name: Build and check the tested image
        run: |
          set -euo pipefail
          docker build --label "org.opencontainers.image.revision=$DEPLOY_SHA" -t "hw-news-bot:$DEPLOY_SHA" .
          docker run --rm --network none "hw-news-bot:$DEPLOY_SHA" python3 -c '
          import importlib, os, pathlib
          assert os.getuid() == 10001
          state = dict(line.split(":", 1) for line in pathlib.Path("/proc/self/status").read_text().splitlines() if ":" in line)
          assert all(int(state[k].strip(), 16) == 0 for k in ("CapEff", "CapPrm", "CapInh", "CapAmb", "CapBnd"))
          assert state["NoNewPrivs"].strip() == "1"
          import news_bot, http_fetch, pending_articles_repo, model_extractor, dom_blocks
          for name in ("claude_transcreation", "gemini_transcreation", "openai_transcreation", "openrouter_transcreation"):
              assert importlib.import_module(name)._load_prompt()
          assert not list(pathlib.Path("/app").rglob("*.db"))
          '
          docker run --rm --network none "hw-news-bot:$DEPLOY_SHA" python3 -m pip check
          docker save "hw-news-bot:$DEPLOY_SHA" | gzip -1 > "$RUNNER_TEMP/image.tar.gz"
          git tag "deploy-build-$DEPLOY_SHA" "$DEPLOY_SHA"
          git bundle create "$RUNNER_TEMP/source.bundle" "refs/tags/deploy-build-$DEPLOY_SHA"
      - name: Prepare recovery checkpoint and encrypted off-host backup
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/deploy_actions.sh prepare
      - name: Preserve encrypted pre-cutover backup
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-backup-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/before.db.age
          if-no-files-found: error
          retention-days: 14
      - name: Deploy and verify the exact revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/deploy_actions.sh activate
      - name: Preserve encrypted cutover backup
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-cutover-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cutover.db.age
          if-no-files-found: ignore
          retention-days: 14
      - name: Preserve sanitized deployment evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/production-result.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Remove incoming archives and runner credentials
        if: always()
        run: bash scripts/deploy_actions.sh cleanup

  record:
    needs: [select, deploy]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      DEPLOY_SHA: ${{ needs.select.outputs.sha }}
    steps:
      - name: Tag the successfully deployed revision
        run: |
          set -euo pipefail
          tag="prod-$(TZ=Europe/Moscow date +%F)"
          current=$(gh api "repos/$GITHUB_REPOSITORY/commits/$tag" --jq '.sha' 2>/dev/null || true)
          if [ "$current" = "$DEPLOY_SHA" ]; then exit 0; fi
          if [ -n "$current" ]; then tag="$tag-${DEPLOY_SHA:0:7}"; fi
          current=$(gh api "repos/$GITHUB_REPOSITORY/commits/$tag" --jq '.sha' 2>/dev/null || true)
          if [ "$current" = "$DEPLOY_SHA" ]; then exit 0; fi
          if [ -n "$current" ]; then echo '::error::Deployment tag already names another revision'; exit 1; fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$tag" -f "sha=$DEPLOY_SHA" >/dev/null
