name: Uptime watch

# EXTERNAL watchdog. The existing `watchdog.sh` runs ON the prod host via cron
# (`docker exec hw-news-bot …`), so it can only catch "bot alive but stuck" — it
# is silent by construction when the host itself stops serving, which is exactly
# what happened on 2026-07-31: no daily ping, no publications, and SSH resetting
# before sshd even sent its banner. A watchdog that lives on the machine it
# watches cannot report that machine being down.
#
# WHY NOT A PLAIN PORT CHECK. Throughout that outage TCP/22 accepted
# connections — `nc -vz` returned "succeeded". Any ordinary uptime service would
# have reported the host healthy. So this workflow deliberately probes two
# things that actually matter:
#
#   1. sshd completes the protocol GREETING (`ssh-keyscan`, no credentials
#      needed — it fetches the host key, which requires sshd to fork and answer).
#      This fails exactly the way the 2026-07-31 outage failed.
#   2. a Telegra.ph page was created today or yesterday — every publication makes
#      one, so this measures the OUTCOME the bot exists for and catches "host
#      fine, bot dead", which no host-level check can.
#      NOT the public channel feed: `t.me/s/<name>` was tried first and returns a
#      stub with zero message blocks for this channel (it is not public), so that
#      probe would have been permanently INCONCLUSIVE — i.e. silent false comfort.
#      Verified against the live API before being trusted.
#
# TWO ALARMS, NOT ONE. The probes fail for unrelated reasons and demand
# unrelated responses, so each carries its own severity, message and dedup flag:
#
#   * probe 1 fails  -> 🔴 the HOST is unreachable. Go to the hoster console.
#   * probe 2 is stale -> 🟡 the host is fine and nothing was PUBLISHED. Look
#     at the queue, the sources and the review pings — never at the console.
#     Unavailable or ambiguous evidence is inconclusive and changes no alarm.
#
# Folding both into one 🔴 «Прод не отвечает» was actively harmful: on
# 2026-08-15 the host was up 15 days, sshd answered, the bot heartbeat was
# fresh, and the only real fact was that the single article of a thin news day
# had been correctly cancelled as a duplicate. The alert still opened with
# «Прод не отвечает» and advised the hoster console — pointing the operator at
# the one layer that was demonstrably healthy. An alarm that misnames the layer
# costs more than no alarm, because it is acted on.
#
# While the host alarm is open the publication alarm stays silent: a dead host
# cannot publish, and saying so twice is noise, not information.
#
# ALERT DEDUP. GitHub Actions is stateless, so an open GitHub issue per alarm is
# used as its flag: one Telegram message when it starts, one when it recovers,
# silence in between. Without this the operator would get a message every 30
# minutes for the whole outage.
#
# KNOWN LIMITS (stated so nobody trusts this more than it deserves):
#   * scheduled workflows are best-effort — GitHub can delay them by 5-15 min,
#     occasionally more, so treat the interval as "about half an hour";
#   * GitHub disables scheduled workflows after 60 days with no repo activity;
#   * if GitHub itself is down, so is this watchdog.
# It is a second pair of eyes, not a guarantee.

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: uptime-watch
  cancel-in-progress: false

env:
  PROD_HOST: 45.90.216.165

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe sshd greeting
        id: ssh
        run: |
          # ssh-keyscan performs the real protocol start and needs no key.
          # -T 15: bounded so a hung server fails rather than stalling the job.
          # Retry three times 20s apart — a single reset can be transient, and a
          # false alarm trains the operator to ignore this channel.
          ok=false
          for attempt in 1 2 3; do
            if timeout 25 ssh-keyscan -T 15 -t ed25519 "$PROD_HOST" 2>/dev/null | grep -q ssh-ed25519; then
              ok=true
              break
            fi
            echo "attempt $attempt: no SSH greeting from $PROD_HOST"
            sleep 20
          done
          echo "ok=$ok" >> "$GITHUB_OUTPUT"
          if [ "$ok" = true ]; then
            echo "sshd answered"
          else
            echo "sshd did NOT answer after 3 attempts"
          fi

      - name: Checkout publication classifier
        id: watch_source
        continue-on-error: true
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          fetch-depth: 1

      - name: Fetch Telegraph evidence
        id: pub_fetch
        if: ${{ always() }}
        continue-on-error: true
        env:
          TELEGRAPH_ACCESS_TOKEN: ${{ secrets.TELEGRAPH_ACCESS_TOKEN }}
        run: |
          set -uo pipefail
          evidence_file="$RUNNER_TEMP/publication-watch-evidence.json"
          rm -f "$evidence_file"

          # The token reaches curl through a private file descriptor and a POST
          # form body. Never switch this request to GET: that would put it in
          # the URL.
          # It is absent from the command line, evidence file, logs and outputs.
          if [ -z "${TELEGRAPH_ACCESS_TOKEN:-}" ]; then
            echo "TELEGRAPH_ACCESS_TOKEN not set — publication evidence unavailable"
            exit 0
          fi

          if ! curl \
            --fail \
            --silent \
            --max-time 20 \
            --max-filesize 1048576 \
            --data-urlencode 'access_token@/dev/fd/3' \
            --data-urlencode 'limit=1' \
            "https://api.telegra.ph/getPageList" \
            3< <(printf '%s' "$TELEGRAPH_ACCESS_TOKEN") \
            | head -c 1048577 > "$evidence_file"; then
            rm -f "$evidence_file"
            echo "Telegraph evidence fetch failed — publication state is inconclusive"
            exit 0
          fi

          evidence_bytes=$(wc -c < "$evidence_file")
          if [ "$evidence_bytes" -eq 0 ] || [ "$evidence_bytes" -gt 1048576 ]; then
            rm -f "$evidence_file"
            echo "Telegraph evidence is empty or oversized — publication state is inconclusive"
            exit 0
          fi
          echo "Telegraph evidence fetched ($evidence_bytes bytes)"

      - name: Classify publication evidence
        id: pub
        if: ${{ always() && steps.watch_source.outcome == 'success' }}
        continue-on-error: true
        run: |
          set -u
          evidence_file="$RUNNER_TEMP/publication-watch-evidence.json"
          state_file="$RUNNER_TEMP/publication-watch-state.txt"
          publication_state=inconclusive
          rm -f "$state_file"

          if [ ! -f publication_watch.py ]; then
            echo "publication classifier unavailable"
          elif [ ! -s "$evidence_file" ]; then
            echo "publication evidence unavailable"
          else
            evidence_bytes=$(wc -c < "$evidence_file")
            if [ "$evidence_bytes" -gt 1048576 ]; then
              echo "publication evidence oversized"
            elif timeout 10 python3 publication_watch.py \
              < "$evidence_file" > "$state_file" 2>/dev/null; then
              # Byte-exact comparison rejects empty, multiline and otherwise
              # unexpected stdout without ever printing repository output.
              for candidate in fresh stale inconclusive; do
                if printf '%s\n' "$candidate" | cmp -s - "$state_file"; then
                  publication_state="$candidate"
                  break
                fi
              done
            else
              echo "publication classifier failed"
            fi
          fi

          echo "state=$publication_state" >> "$GITHUB_OUTPUT"
          echo "publication state: $publication_state"

      - name: Decide
        id: verdict
        if: ${{ always() }}
        env:
          SSH_OK: ${{ steps.ssh.outputs.ok }}
          PUB_STATE: ${{ steps.pub.outputs.state }}
        run: |
          # A skipped/failed classifier has no output. Unknown values are also
          # uncertainty, never evidence of either silence or recovery.
          case "$PUB_STATE" in
            fresh|stale|inconclusive) ;;
            *) PUB_STATE=inconclusive ;;
          esac

          # Each probe becomes its OWN verdict. They are never merged into a
          # single "down" flag again: the whole point is that the operator can
          # read the severity and know which layer to open.
          if [ "$SSH_OK" != true ]; then
            echo "host_down=true" >> "$GITHUB_OUTPUT"
          else
            echo "host_down=false" >> "$GITHUB_OUTPUT"
          fi
          echo "pub_state=$PUB_STATE" >> "$GITHUB_OUTPUT"

      - name: Alert or recover
        env:
          GH_TOKEN: ${{ github.token }}
          # Mandatory: checkout credentials are deliberately not persisted, so
          # issue bookkeeping never relies on git auth or remote inference.
          GH_REPO: ${{ github.repository }}
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_ID }}
          # Step outputs arrive as ENV, never interpolated into the shell body.
          # GitHub's own hardening guidance: `${{ }}` inside `run:` is textual
          # substitution before the shell sees it, so anything that ever becomes
          # attacker-influenced turns into command injection. Nothing here is
          # today — the strings are generated a few lines above — but the habit
          # is what keeps it true after the next edit.
          HOST_DOWN: ${{ steps.verdict.outputs.host_down }}
          PUB_STATE: ${{ steps.verdict.outputs.pub_state }}
        run: |
          set -u
          HOST_TITLE="🔴 Прод не отвечает"
          PUB_TITLE="🟡 Прод не публикует"

          send() {
            if [ -z "${BOT_TOKEN:-}" ] || [ -z "${CHAT_ID:-}" ]; then
              echo "TELEGRAM_BOT_TOKEN / TELEGRAM_ADMIN_ID not set — skipping Telegram, issue state still updated"
              return 0
            fi
            # --data-urlencode keeps the body out of the URL, so the token is
            # never written into a log line alongside message text.
            curl -fsS --max-time 20 \
              "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
              -d "chat_id=${CHAT_ID}" \
              --data-urlencode "text=$1" >/dev/null || echo "Telegram send failed"
          }

          # Open-issue lookup per alarm. The two titles share no distinctive
          # word ("отвечает" vs "публикует"), so GitHub's AND-of-terms title
          # search cannot return one for the other.
          find_issue() {
            gh issue list --state open --search "$1 in:title" --json number --jq '.[0].number' || true
          }

          # Telegram FIRST, issue bookkeeping second, and the bookkeeping may
          # never abort the step. The issue is only a dedup flag; the message is
          # the entire product of this workflow. Run #195 had them the other way
          # round and a `gh` failure swallowed the alert — the same lesson the
          # bot itself learned with [E038], where the ping was moved outside the
          # repo call's try for exactly this reason.
          raise() {   # $1 title, $2 telegram text, $3 issue body
            existing=$(find_issue "$1")
            if [ -n "$existing" ]; then
              echo "already alerted (issue #$existing) — staying silent"
              return 0
            fi
            send "$2"
            gh issue create --title "$1" --body "$3" >/dev/null \
              || echo "issue create failed — alert was already sent; dedup degraded to one message per run"
          }

          resolve() {   # $1 title, $2 telegram text
            existing=$(find_issue "$1")
            if [ -z "$existing" ]; then
              echo "no open alarm for «$1» — nothing to clear"
              return 0
            fi
            send "$2"
            gh issue close "$existing" --comment "Проверка снова проходит." >/dev/null \
              || echo "issue close failed — recovery message was already sent"
          }

          # ---- host alarm (🔴) -------------------------------------------------
          if [ "$HOST_DOWN" = true ]; then
            raise "$HOST_TITLE" \
              "$(printf '[watch] 🔴 Прод не отвечает\n\n• сервер не отвечает на SSH (не присылает приветствие)\n\nЗайти по SSH может не получиться — используй консоль хостера.')" \
              "Проба SSH-приветствия не прошла три раза подряд."
          else
            resolve "$HOST_TITLE" "[watch] 🟢 Прод снова отвечает."
          fi

          # ---- publication alarm (🟡) -----------------------------------------
          # Suppressed while the host is down: an unreachable host trivially
          # explains the missing publications, and a second ping would only
          # dilute the one that matters.
          if [ "$HOST_DOWN" = true ]; then
            echo "host alarm active — publication alarm suppressed"
          else
            case "$PUB_STATE" in
              stale)
                raise "$PUB_TITLE" \
                  "$(printf '[watch] 🟡 Больше суток нет публикаций\n\nСервер и SSH отвечают — с хостом всё в порядке, в консоль хостера идти незачем.\n\nСмотреть здесь: жив ли контейнер (docker ps), не пуста ли очередь (pending_articles) и не была ли единственная статья дня отменена в ревью.')" \
                  "Свежей страницы Telegra.ph нет больше суток, при этом SSH-проба проходит."
                ;;
              fresh)
                resolve "$PUB_TITLE" "[watch] 🟢 Публикации возобновились."
                ;;
              inconclusive)
                echo "publication state inconclusive — publication alarm unchanged"
                ;;
              *)
                echo "unexpected publication state — publication alarm unchanged"
                ;;
            esac
          fi
