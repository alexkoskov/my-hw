# Interview Plan for Feature Planning
#
# Tracks progress of adaptive discovery interview for a new feature/bug/refactoring.
# Updated after EACH user response with scoring, values, and remaining gaps.
#
# Scoring: 0-100% (how well we understand this aspect)
# Status: pending → partial → complete
# Required: true = must reach threshold, false = cover if relevant

# ============================================================================
# Interview Metadata (Session Recovery)
# ============================================================================
interview_metadata:
  started: "2026-07-09 15:32:00"
  last_updated: "2026-07-10 13:00:00"
  status: "completed"  # not_started | in_progress | completed
  can_resume: true
  current_question_num: 4
  feature_size: "L"  # new series/theme extraction + lexicon + dedup-logic change + backfill + calibration; touches publish path

# ============================================================================
# Conversation History (for session recovery)
# ============================================================================
# Preserves complete Q&A. Update after EVERY user response.
#
conversation_history:
  - question_num: 1
    timestamp: "2026-07-09 15:34:00"
    topic: "core dedup design (Cycle 1 batch 1)"
    agent_question: |
      1. Dedup by ANY source or cross-source only? 2. What counts as "series"
      (car-lines only vs also events + pop-culture franchises)? 3. Article with a
      model but no recognised series/theme → block-on-model / fall back to current
      set-overlap / pass? 4. New rule INSTEAD of or IN ADDITION to the current
      50%-overlap dedup?
    user_answer: |
      1. По любому источнику. 2. По рекомендации — широко: car-lines + события
      (Comic-Con) + поп-культурные франшизы (Stranger Things, Top Gun, K-Pop
      Demon Hunters). 3. По рекомендации — откат к нынешней логике (set-overlap
      ≥50%, 7 дней) когда серию не распознали. 4. В дополнение (не вместо).
    summary: "ANY source; broad series incl. events+franchises; no-series → fall back to current set-overlap; new (model+series) rule ADDS to the existing dedup."
  - question_num: 2
    timestamp: "2026-07-09 15:40:00"
    topic: "window / multi-item / block-visibility / safety (Cycle 1-2 batch 2)"
    agent_question: |
      5. Window = 2 months (60d)? 6. Multi-item articles: block if ≥half the new
      article's (model+series) pairs were already covered? 7. Silent hard block
      + [E015] ping, or show operator? 8. Degraded-mode on crash + one-time
      backfill — ok?
    user_answer: |
      5. 30 days (not 60). 6. Block the WHOLE article if there is AT LEAST ONE
      overlapping (model+series) pair. 7. "Показывать" (notify me, not silent).
      8. ok.
    summary: "Window 30d. AGGRESSIVE: block whole article on ANY single overlapping pair. Block must be VISIBLE (notify operator). Degraded-mode + backfill OK. NOTE: any-overlap + broad themes risks over-blocking legit new drops that share one casting — challenge raised in batch 3."
  - question_num: 3
    timestamp: "2026-07-10 12:00:00"
    topic: "success criteria / testing / accepted risk (batch 3) + challenge on aggressiveness"
    agent_question: |
      Success = 3 real SDCC dupes MUST be caught + 2-week channel monitoring; tests
      mirror existing feature (unit + calibration fixture + integration). Accepted
      risk: aggressive any-overlap block. Manual re-publish for false blocks, or
      just notify?
    user_answer: |
      "ок" to success/testing/accepted-risk. "просто уведомить" — just notify, no
      manual re-publish button.
    summary: "Success/testing confirmed. No manual re-publish path — just notify."
  - question_num: 4
    timestamp: "2026-07-10 12:30:00"
    topic: "post-validation redesign — tiering + toggle + composition + backfill"
    agent_question: |
      Adequacy+quality validators flagged: (a) aggressive silent block too risky
      (concrete over-block: theme-only 'stranger things' mainline vs SDCC kills the
      2nd); (b) 'no soft-flag' was inferred, not chosen; (c) composition gap — old
      dedup skipped when series recognised but no pair match; (d) prod base likely
      NEVER backfilled. Choose block rule A (fully aggressive) vs B (tiering); confirm
      old-dedup always backstops.
    user_answer: |
      Block rule = B (tiering). Composition backstop = ok. NEW: make the pair-rule
      OPTIONAL — a toggle, default ON (main rule) but disableable without a code
      change. "продолжим двигаться по флоу". Backfill/cold-prod plan = ok.
    summary: "B (tiering): distinctive model+franchise pair → hard-block [E015]; broad theme-only / recurring car-line → soft-flag [E014]. Old set-overlap ALWAYS backstops when new rule doesn't hard-block. NEW REQUIREMENT: env toggle (default on) to disable the pair-rule — runtime safety valve. Backfill --days 30 warms both base + pairs; pre-deploy SELECT COUNT check."
