    status: "complete"
    value: |
      Three new SQLite tables in `news.db`:

      **pending_articles** — work in progress.
      Columns: link (PK), title, subtitle, paragraphs (JSON),
      images (JSON), blocks (JSON nullable), pub_date, fetched_at,
