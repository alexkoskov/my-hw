# ============================================================================
# Phase 1: High-Level Feature Understanding
# ============================================================================
# Interview Cycle 1 scope
phase1_feature_overview:

  feature_name:
    score: 95
    status: "complete"
    value: "manual-review-workflow"
    gaps: ""
    required: true

  feature_description:
    score: 95
    status: "complete"
    value: |
      Split the bot pipeline into two independent phases:

      (1) **Prep phase** — cron (daily at 12:00 today; frequency may
          increase in tech-spec to support the 1h grace window).
          Fetches RSS + Mattel + Lamley, dedupes via processed_news,
          runs fetch_full_article for each new entry, stores results
          in a new `pending_articles` table. Admin Telegram ping is
          sent ONLY if queue non-empty, format:
          "3 ждут review: 🟠 autoevolution ×2, 🟣 mattel ×1".
          Publishes NOTHING directly.

      (2) **Review + publish phase** — user-triggered via Claude Code.
          Trigger phrase: "посмотрим очередь" — Claude runs hw_review
          list, walks each item, the user and Claude co-write Russian
          inline, hw_review preview creates a Telegraph draft for
          visual check, hw_review publish finalises to a fresh
          Telegraph page + Telegram channel card + mark_processed.
          Discarded drafts are blanked via editPage (Telegra.ph lacks a
          delete endpoint) and tracked in a cleanup list.

      (3) **Stale fallback** — if a pending article has been sitting
          >48h, a fallback pass in job() sends a heads-up admin ping
          ("Will auto-publish in <grace window>: [titles]"). During the
          grace window the user can intercept via `hw_review take N`.
          When the window elapses and the article still has no Russian
          text, the bot runs transcreate_text (Google Translate + regex)
          and auto-publishes to keep the channel alive.

      (4) **Overflow handling (cap=10)** — when prep-phase finds the
          pending queue at or near its 10-slot cap, it fast-tracks the
          oldest pending entries through transcreate_text + publish to
          free slots before adding new ones. Oldest entries thereby
          graduate to the channel one way or the other (either via
          user review, or via Google-Translate fallback on pressure).

      Trade-off: the channel is no longer fully unattended; the user
      reviews day-to-day, but a degraded safety net exists so the feed
      never goes completely silent.
    gaps: ""
    required: true

  work_type:
    score: 95
    status: "complete"
    value: "feature"
    gaps: ""
    required: true

  user_problem:
    score: 90
    status: "complete"
    value: |
      Current fully-automatic flow produces mechanical Russian (Google
      Translate + regex): calques, wrong agreement, glossary misses,
      passive cluncky phrasing. User wants channel posts rewritten by a
      human-in-the-loop at the quality Claude Code produces — but
      without paying for OpenAI API tokens now and without changing the
      Python-on-Linux bot architecture. The existing Max subscription
      covers unlimited interactive Claude Code work, so the translation
      engine becomes "the operator sitting at Claude Code". The bot's
      job changes from end-to-end automation to preparing a review
      queue and publishing what the operator blesses, with a
      transcreate_text safety net when the operator is absent.
    gaps: ""
    required: true

  target_users:
    score: 80
    status: "complete"
    value: |
      Primary: the bot operator (user) — gains full editorial control
      over what ships to @myhwchannel123 and in what Russian voice.
      Secondary: Hot Wheels enthusiasts on the channel — receive higher
      quality posts. No change to audience, only improved output.
    gaps: ""
    required: false

  success_criteria:
    score: 95
    status: "complete"
    value: |
      - Prep phase runs on cron without touching Telegram channel.
      - Every new entry from every source (RSS, Mattel, Lamley) lands
        in pending_articles with full title/subtitle/paragraphs/images
        (+ blocks if source provides them).
      - Admin Telegram ping fires ONLY if queue non-empty; format
        exactly "N ждут review: 🟠 autoevolution ×K, 🟣 mattel ×M,
        🟢 lamley ×L" (skip sources with zero new entries).
      - `hw_review publish N` produces a Telegram channel post visually
        identical to the current automatic flow (same locked post-format).
      - Skipped articles never resurface in `hw_review list`.
      - Articles idle >48h trigger a heads-up admin ping with
        intercept window; after the window, transcreate_text +
        auto-publish runs and the entry leaves the queue.
      - Queue never exceeds 10 concurrent pending entries. When the
        cap is hit, oldest entries graduate via the fast-track
        Google-Translate path before new entries are added.
      - Telegraph drafts created during preview are blanked via
        editPage when the user skips the article or when publish
        creates the final page.
      - All 106 existing tests stay green after job() refactor.
      - New test suite covers pending_articles CRUD, CLI parsing,
        admin-ping format, prep-phase integration, publish-phase
        integration, migration (fresh DB), and the idle-fallback
        + overflow paths.
    gaps: ""
    required: true

  constraints:
    score: 95
    status: "complete"
    value: |
      - Stay on Python (n8n rejected 2026-04-22).
      - No external LLM API in this feature (no OpenAI, no Anthropic API).
        Claude Code session under Max subscription is the translation tool.
      - Locked post format (`work/telegraph-pipeline/post-format.md`)
        unaffected — output shape identical to current automatic flow.
      - Duplicate detection (`processed_news` table) stays unchanged.
      - `job()` keeps running on cron; its body shrinks to
        prep + fallback-heads-up + overflow-fast-track (no direct publish
        for user-reviewable entries).
      - Queue hard cap: 10 concurrent pending_articles.
      - Idle timeout: 48h without user action → heads-up admin ping,
        then (after the grace window elapses) transcreate_text +
        auto-publish.
      - Overflow semantics: when the cap is reached, oldest pending
        entries are fast-tracked through transcreate_text + auto-publish
        to free slots before new entries are added.
      - Trigger phrase to switch Claude Code into review mode:
        "посмотрим очередь".
      - Intercept phrase (bypass fallback): `hw_review take N`.
      - Preview uses Telegraph drafts; discarded drafts are blanked via
        editPage (Telegra.ph has no delete endpoint).
      - 1h grace-window length is aspirational — actual interval is
        determined by cron frequency, which may be bumped from daily
        to every few hours during tech-spec.
    gaps: ""
    required: true

  testing_strategy:
    score: 90
    status: "complete"
    value: |
      Approved plan (user sign-off 2026-04-22 Q2):
      - Unit: pending_articles CRUD, CLI argument parsing, admin-ping
        format (source emoji mapping + count aggregation).
      - Integration prep-phase: mocked source fetchers, verify queue
        population + admin ping + no Telegram channel writes.
      - Integration publish-phase: mocked telegraph_publisher + Telegram
        Bot, verify final page matches locked post-format, verify
        mark_processed called, verify draft blanking on skip.
      - Migration: fresh DB creates pending_articles with correct schema.
      - Idle-fallback test: simulate >48h stale entry, verify heads-up
        admin ping → intercept window → transcreate_text + publish path.
      - Overflow test: fill queue to 10, verify fast-track of oldest
        entries on next prep-phase run.
      - Regression: all 106 existing tests green after job() refactor.
    gaps: ""
    required: true

# ============================================================================
# Phase 2: User Experience & Scenarios
# ============================================================================
# Interview Cycle 2 scope (together with Phase 3)
phase2_user_experience:

  user_stories:
    score: 90
    status: "complete"
    value: |
      **Story 1: Happy-path morning triage.**
      - 12:00 cron fires; prep fetches from all sources, dedupes via
        processed_news / seen-links, calls fetch_full_article for each
        new link, INSERTs row into pending_articles with ru_* = NULL,
        status='pending', fetched_at=now.
      - Bot sends admin Telegram: "3 ждут review: 🟠 autoevolution ×2,
        🟣 mattel ×1".
      - User opens Claude Code, types "посмотрим очередь".
      - Claude runs hw_review list → shows numbered rows with source,
        title, paragraph count, age.
      - User picks #1; Claude runs hw_review show 1 → dumps English.
      - Claude writes a Russian retelling in chat; user iterates via
        edits ("сократи", "добавь ироничности", etc.).
      - Claude calls hw_review stage 1 with final ru_title,
        ru_subtitle, ru_paragraphs, ru_blocks.
      - Claude calls hw_review preview 1 → Telegraph draft URL; user
        opens in browser.
      - User says "публикуй"; Claude runs hw_review publish 1 →
        createPage (fresh final page), send_telegraph_teaser, editPage
        to blank the draft, move row from pending_articles to
        published_articles with via_review=true.
      - Loop through items 2–N.

      **Story 2: Silent morning (nothing to review).**
      - 12:00 cron runs, queue stays empty. No admin ping. No channel
        post. Logs only.

      **Story 3: Stale-entry fallback.**
      - Day N 12:00: article X added to pending_articles.
      - Day N+2 12:00 (≥48h): fallback pass finds X idle; sends admin
        heads-up "Will auto-publish in <grace>: [X title]. Intercept
        via `hw_review take 1`". Stamps notified_at.
      - After the grace window elapses on a later cron tick, if
        ru_* still NULL, bot calls transcreate_text → publishes →
        move to published_articles with via_review=false.
      - If user ran hw_review take 1 during the grace window, row's
        notified_at is cleared; article goes through normal review
        flow.

      **Story 4: Queue overflow.**
      - Prep fetches and finds that len(pending_articles) + new_count
        > 10. Identifies oldest N pending rows to graduate: for those,
        runs transcreate_text + publish immediately (same as stale
        fallback, but without the grace window — slot pressure forces
        action). Moves them to published_articles with via_review=false.
        Admin ping: "Queue pressure: auto-published 2 entries, 3 new
        added".

      **Story 5: GT fallback fails repeatedly.**
      - Fallback attempts transcreate_text; Google Translate returns
        an empty string / raises.
      - Log + admin ping, attempt_count += 1. After 3rd failure the
        row moves from pending_articles to failed_articles with
        last_error, failed_at. User can later inspect and optionally
        re-trigger.

      **Story 6: Skip with staged text.**
      - User runs hw_review skip N where ru_* is non-NULL.
      - CLI prompts: "В записи N уже сохранён твой русский (title/
        subtitle/paragraphs). Точно скипнуть? (y/N)".
      - On y: blank preview draft via editPage if preview_path is set;
        delete row from pending_articles; write link to processed_news
        so it never resurfaces from RSS. No row in published_articles
        — skipped isn't a publish.

      **Story 7: Retry from failed.**
      - User sees failed backlog in `hw_review list` footer.
      - User runs `hw_review retry N` where N references a failed row.
      - CLI moves row back to pending_articles (attempt_count=0,
        status='pending', fetched_at=now), deletes from failed_articles.
      - Next cron tick: fallback pass treats it as fresh; if it's been
        there >grace (it has, because it's old), GT is tried again.
        On third new failure → back to failed_articles.

      **Story 8: Startup double-run on deploy day.**
      - Container starts after deploy. news_bot.main() calls job()
        immediately (news_bot.py:461) → prep fetches sources, INSERTs
        into pending_articles, sends admin ping.
      - Same day 12:00 scheduled job() runs: filter_new_entries skips
        already-queued links (processed_news covers them), admin ping
        reflects current queue.
      - Accepted trade-off: one extra admin ping on deploy day only.
    gaps: ""
    required: true

  acceptance_criteria:
    score: 90
    status: "complete"
    value: |
      Cross-referenced with `phase1_feature_overview.success_criteria`
      (canonical list). Additional user-flow specific criteria:

      - `hw_review list` on empty queue shows "queue is empty"; on
        non-empty shows numbered rows with source emoji + title +
        paragraph count + age.
      - `hw_review list` always footer-reports non-empty
        `failed_articles` (count + titles + retry hint).
      - `hw_review stage N` requires all ru_* fields; partial staging
        rejected.
      - `hw_review preview N` without prior `stage` refuses with clear
        error.
      - `hw_review skip N` with staged ru_* requires y/N confirmation.
      - `hw_review publish N` is idempotent on Telegram-only retry
        (same ru_* state yields the same channel post).
      - Source registry in news_bot.py iterates autoevolution RSS +
        Mattel uniformly; adding a new source is editing one list.
      - CI gate runs pytest on every PR; migration test asserts fresh
        DB has all 4 tables with correct schema.
      - processed_news row exists for every link that was EITHER
        published OR skipped — the dedup set is the union.
    gaps: ""
    required: true

  edge_cases:
    score: 90
    status: "complete"
    value: |
      - **skip with staged ru.** Requires y/N confirmation (option b).
      - **Skipped link destination.** Written to processed_news only
        (option ii). Never reappears in review (dedupe guarantee) and
        never appears in published_articles (aggr purity).
      - **Same link appears in two sources (cross-post).** processed_news
        PRIMARY KEY on link dedupes; second source's link is skipped at
        filter_new_entries time.
      - **Article preview requested before stage.** hw_review preview N
        where ru_* is NULL → CLI refuses: "Nothing to preview — stage
        Russian text first via `hw_review stage N`".
      - **Admin ping when queue empty.** Do not send (success criterion).
        Exception: if failed_articles is non-empty, may still ping with
        only the "failed backlog" line.
      - **`hw_review list` reminder for failed_articles.** Every run
        appends a footer like "⚠️ 2 неопубликованных в failed: [titles].
        `hw_review retry N` чтобы переподнять". Consistent visibility.
      - **Queue at exactly 10, prep finds 0 new.** Do not fast-track;
        overflow trigger requires slot pressure (new_count > free_slots).
      - **User intercepts fallback (`take N`) after grace window has
        already fired.** CLI refuses: "N already auto-published, nothing
        to intercept". Idempotent.
      - **attempt_count resets.** A successful `publish` removes the row
        from pending_articles entirely (moves to published_articles), so
        attempt_count is implicitly zeroed.
      - **Two cron preps overlap (if hourly schedule).** SQLite UNIQUE
        on `pending_articles.link` prevents duplicate inserts; raced
        IntegrityError is caught + logged as expected race.
      - **news.db deleted / recreated.** CLI on empty DB says "queue
        empty, failed_articles empty". Nothing to rollback — RSS will
        re-surface entries.
      - **Article has empty paragraphs after fetch_full_article.**
        Current pipeline skips (news_bot.py:372-374). New prep phase
        preserves the same skip rule — no stub rows in pending_articles.
    gaps: ""
    required: true

  error_scenarios:
    score: 90
    status: "complete"
    value: |
      - **Google Translate fails during fallback.** Log + admin ping
        "GT fallback failed for N: <error>. Attempts: K/3". Bump
        attempt_count column on the pending row. On the 3rd failure
        move the row to `failed_articles` (terminal state, no more
        retries; user can re-trigger manually if desired).
      - **editPage fails when blanking a discarded draft.** Log
        warning. Don't retry in-line (the final page is already live,
        user isn't blocked). `hw_review cleanup-drafts` runs lazily on
        next cron tick and retries.
      - **Publish fails mid-way (Telegraph ok, Telegram fail).**
        Rollback-none: Telegraph page stays live. pending row keeps
        ru_* intact and status='pending'. processed_news not written,
        published_articles not written. Next `hw_review publish N`
        uses same ru_* to retry Telegram only (idempotent — same URL).
      - **Admin ping fails (Telegram bot down).** Log error, no retry.
        Next cron tick's ping reflects the current queue state, so
        transient failures self-heal.
      - **`hw_review stage` crashes mid-execute.** Nothing committed —
        CLI uses a single UPDATE statement. ru_* stay NULL. User
        re-runs.
      - **Cron prep crashes between fetch_full_article and INSERT.**
        Nothing written. Link isn't in processed_news yet. Next cron
        tick sees it as "new" and re-fetches. Safe, slightly wasteful.
      - **Cron prep crashes after INSERT but before admin ping.** Row
        exists in pending_articles; next cron tick includes it in
        the counts — user gets the ping then.
      - **Two cron preps overlap (e.g. on hourly schedule).**
        SQLite UNIQUE(link) on pending_articles prevents duplicates.
        Second prep's INSERT raises IntegrityError which is caught +
        logged (expected race).
    gaps: ""
    required: true

  verification_strategy:
    score: 90
    status: "complete"
    value: |
      **Agent-side (automated and for my sessions):**
      - pytest covers CRUD, CLI parsing, admin-ping format, prep/publish
        integration, migration, idle-fallback, overflow, regression.
      - Telegram MCP (if installed) reads last channel message to
        confirm hashtag + preview after a publish run.
      - curl/HTTP GET on Telegraph draft URL confirms blanked content
        after cleanup-drafts.
      - news.db snapshot after prep: row counts by source match admin
        ping numbers.

      **User-side (manual):**
      - Open @myhwchannel123 after first review post — visual match
        with locked post-format reference (msg 35).
      - Open Telegraph draft URL during preview step — visual layout,
        hero image, subtitle, body.
      - Check admin chat for ping format: emoji per source + counts.

      **Golden post:** after the feature ships, publish one article via
      the full review flow and diff the channel card + Telegraph page
      against msg 35 — should be indistinguishable.
    gaps: ""
    required: true

  ui_ux_requirements:
    score: 0
    status: "pending"
    value: ""
    gaps: "Specific UI/UX requirements if applicable"
    required: false

  risks:
    score: 90
    status: "complete"
    value: |
      - **Refactor of job() breaks 8 existing auto-publish tests**
        (test_integration, test_mattel_integration, test_feed_iteration).
        **Mitigation:** rewrite those tests in the same PR; green-run
        before merge.
      - **Cron frequency bump hits rate limits on RSS/Mattel.**
        **Mitigation:** keep daily default; document optional hourly;
        fetch_full_article cached once per run; curl_cffi backoff stays
        on autoevolution.
      - **news.db corruption loses queue.** **Mitigation:** RSS
        re-surfaces entries; no long-term damage; `.db` backup optional
        pre-deploy.
      - **Telegraph editPage API changes / deprecates.**
        **Mitigation:** cleanup-drafts catches errors and alerts;
        fall back to "leave draft alive, user manually cleans".
      - **publish_article signature change (return path) breaks
        test_telegraph_publisher.** **Mitigation:** fix in same PR.
      - **User away >48h but failed_articles fills up repeatedly**
        (GT hiccups). **Mitigation:** every `hw_review list` surfaces
        failed backlog; user can `hw_review retry N` manually.
      - **Bot moves from local Docker to VPS mid-feature.**
        **Mitigation:** feature is hosting-agnostic; deployment steps
        are identical.
    gaps: ""
    required: true

  technical_decisions:
    score: 85
    status: "complete"
    value: |
      - **`publish_article` return shape:** change to return a dict
        `{'url': str, 'path': str}` (keep `path` that API already gives
        us in `result["path"]`; stop discarding it). Needed for later
        `editPage` calls on the same page. Parsing path from URL is
        brittle — URL slug is auto-generated with date suffix.
      - **`editPage` wrapper:** add a new function `edit_page(path,
        title, content, ...)` in telegraph_publisher.py following the
        same pattern as `_api_call("createPage", ...)`. No new module.
      - **CLI entry point:** `hw_review.py` at repo root (consistent
        with other scripts like `post_latest_news.py`). stdlib argparse,
        no new dependency. Invokable both as `python hw_review.py list`
        and via a thin shell alias.
      - **Telegraph draft creation timing:** draft created only on
        explicit `hw_review preview N` call (never at prep or stage
        time). `hw_review publish N` skips the `editPage` blanking
        step when `preview_path` is NULL. Minimizes Telegraph page
        count for articles that never got a visual check.
      - **Startup immediate run:** news_bot.main() keeps its
        immediate `job()` call at startup (news_bot.py:461). Accepted
        side effect: on deploy day the admin may see two queue pings
        (immediate + scheduled). Trade-off accepted for simplicity.
      - **Retry mechanics:** `hw_review retry N` moves a row from
        failed_articles back to pending_articles (attempt_count=0,
        status='pending', fetched_at=now). The next cron tick's
        fallback pass then re-tries GT. No synchronous translation
        inside the CLI — keeps the command responsive.
      - **Repository layer:** new `pending_articles_repo.py` at repo
        root holds CRUD for pending / published / failed tables. Keeps
        news_bot.py focused. Matches `*_source.py` naming convention.
      - **Source registry:** `SOURCES` list in news_bot.py mapping name
        → callable returning entries. RSS expanded to (name='rss',
        fn=lambda: fetch_rss_feeds()). Mattel as (name='mattel',
        fn=lambda: fetch_mattel_news(...)). Iteration in job() becomes
        a simple for-loop.
      - **Deferred:** LLM-based transcreation (separate feature), Batch
        API (separate feature), auto-retry from failed_articles
        (manual via `hw_review retry N`).
    gaps: ""
    required: false

  deploy_approach:
    score: 90
    status: "complete"
    value: |
      Current hosting: local Docker on user's workstation. Target:
      migrate to VPS later (out of scope for this feature — the feature
      is hosting-agnostic).

      Deploy steps:
      1. Develop on dev branch; pytest all green (106 existing + new).
      2. CI gate on every PR — `pytest tests/` plus new migration test
        (create fresh tempfile DB, run init_db, assert all 4 tables
        exist with correct DDL). Catches migration regressions cheaply.
      3. Merge dev → main.
      4. Stop running container (`docker stop`).
      5. `git pull`, rebuild image if needed.
      6. Start container. First cron tick creates missing tables via
        `CREATE TABLE IF NOT EXISTS`. Existing processed_news rows
        untouched — backward compatible.
      7. First admin ping arrives with real queue.

      No formal staging environment. For extra safety before first
      real run, optionally: clone the channel to a test channel,
      switch TELEGRAM_CHANNEL_ID in .env, run one smoke cycle, then
      switch back. My recommendation: skip staging, since the feature
      stops auto-posting entirely on its own — no risk of bad posts
      flooding the channel during rollout.
    gaps: ""
    required: false

  manual_user_actions:
    score: 90
    status: "complete"
    value: |
      What the user MUST do manually (I cannot):
      - Pull the updated repo to their Docker host / VPS.
      - Stop and restart the bot container.
      - Confirm env vars in .env: `TELEGRAM_ADMIN_ID` explicitly set
        (not rely on the hardcoded default `@sunny413x` unless that
        matches them).
      - After first deploy, wait for first admin ping and invoke the
        review flow at least once to confirm end-to-end behavior.
      - Optional: decide on cron frequency (daily vs hourly) and
        tweak `news_bot.py:458`. Default stays daily in this feature;
        bumping is a 1-line follow-up.

      What I do for them:
      - All code: refactor job(), new repo module, new CLI, editPage
        wrapper, source registry, migration.
      - All tests: rewrite affected integration tests, new unit +
        integration tests for the new paths.
      - CI migration gate.
      - Documentation updates (project-knowledge files after
        `/done`).
      - Code review + security audit via agents.
    gaps: ""
    required: false

