      EC6. body="$N" но row N не появляется в pushes (RSC stream incomplete) —
           paragraphs=[], notifier не вызываем (это контентная пустота, не парс-ошибка).
      EC7. На article-странице article2.entries есть, но handle нужной статьи
           отсутствует — fallback: ищем entry по url field, иначе MattelNewsError
