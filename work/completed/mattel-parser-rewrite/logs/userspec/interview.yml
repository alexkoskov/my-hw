      - Если в течение 7 дней Mattel выпустит HW-релиз — убедиться, что он
        прошёл в pending_articles и оператор получил queue-pressure ping.

      No live-MCP verification needed — это backend-парсер без UI.
    gaps: ""
    required: true

  ui_ux_requirements:
    score: 100
    status: "complete"
    value: "Not applicable — backend parser, no UI/UX surface."
    gaps: ""
    required: false

  risks:
    score: 90
    status: "complete"
    value: |
      R1. Будущая смена layout RSC: Mattel/Next.js может перетасовать row IDs,
          chunk-разбиение, или ключи (article2 → articles_v3 etc).
          Mitigation: anchor на семантические маркеры
          ("article2":{"entries":[, "handle":, "title":, "date":), а не позицию push'а.
          Если сломается — admin-ping сработает, оператор зафиксирует регресс.
      R2. Hand-crafted fixture рискует разойтись с реальным форматом, и тесты
          станут зелёными при сломе на проде.
          Mitigation: фикстуру для smoke-tests строим из живой страницы
          (snapshot верифицирован в research) + минимальная подмена для
          инжекции HW-entry; integration-тест на одно живое полное reading
