  feature_description:
    score: 90
    status: "complete"
    value: |
      Переписать извлечение данных в mattel_news_source.py. Текущая реализация ищет
      <script id="__NEXT_DATA__"> на https://corporate.mattel.com/news и на страницах
      отдельных статей. Mattel переехал на Next.js App Router + RSC-стриминг —
      этого тега больше нет, парсер тихо возвращает [] / None.

      Механизм замены — regex-парсинг RSC flight payload (self.__next_f.push([1,"..."])).
      Проверено live 2026-04-24: entries с ключами handle/title/date/excerpt/seo_desc
      присутствуют в крупнейшем push'е listing-страницы, просто с двойной JSON-экранировкой.
      Fallback-опций (undocumented Builder.io/Contentstack API, headless браузер) в скоуп
      не включаем — будущие итерации если потребуются.

      Внешний контракт сохраняется без изменений, чтобы news_bot.job() работал как есть:
      - fetch_mattel_news() → List[feedparser-compatible dict] (link, title, summary, published_parsed, feed_url)
      - fetch_mattel_article(link) → {title, subtitle, paragraphs, images} или None на ошибке
      - notifier-контракт (admin-ping при структурной ошибке) сохраняется
      - image-policy «thumbnail only» (patterns.md) сохраняется
