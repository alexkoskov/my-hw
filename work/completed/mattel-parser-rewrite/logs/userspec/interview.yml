      D5. Body extraction: RSC text-row reconstruction (body="$N" → row "N:T<hex>,..."),
          не brute-force <p>-scan (sidebar pollution).
      D6. summary: оставляем "excerpt or title" (downstream не использует).
      D7. Image-only HW: оставляем downstream-skip (news_bot.py:1231 if not paragraphs).
      D8. Field name correction: seo_description (не seo_desc — последнее
