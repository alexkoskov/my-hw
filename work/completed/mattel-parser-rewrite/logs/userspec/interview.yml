          на curl_cffi (уже в стеке для autoevolution). Не делаем upfront —
          YAGNI.
      R6. Wayback не сохраняет RSC-формат (research §7) — если live сайт
          сломается надолго, мы не сможем дебажить через snapshot.
          Mitigation: периодически сохранять live snapshot в /tmp перед
          deploy фичи. Принимаем — приемлемый риск для P1-фичи.
    gaps: ""
    required: true

