          Mitigation: алгоритм работает с конкатенацией ВСЕХ pushes до начала
          поиска row-marker — границы pushes не имеют значения.
      R4. Mattel CDN/edge может отдать flight payload с другим row-id для body
          (не $54, а $77 etc).
          Mitigation: $N парсится из метаданных entry, а не хардкодится.
      R5. requests.get может получить Cloudflare interstitial (как
          autoevolution).
          Mitigation: сейчас живой fetch отдаёт 200 OK через plain requests +
