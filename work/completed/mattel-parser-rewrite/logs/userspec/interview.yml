    required: true

  error_scenarios:
    score: 90
    status: "complete"
    value: |
      ES1. Network failure (requests.RequestException) — caught, notifier
           "Mattel news HTTP error: {exc}", возврат [] / None.
      ES2. HTTP 4xx/5xx — raise_for_status поднимает HTTPError,
