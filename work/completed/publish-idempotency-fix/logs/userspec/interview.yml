      - Первопричина появления stale pending row — отдельный операторский task диагностики.
    gaps: ""
    required: true

  error_scenarios:
    score: 90
    status: "complete"
    value: |
      ES1 — get_published бросает sqlite OperationalError: пропагируется в slot loop, ловится
            как обычная publish failure, attempt_count++. (Acceptable; redundant retry на
            следующем слоте; первое же выполнение get_published на свежем connection
            покрывает временные lock'и через PRAGMA busy_timeout=5000.)
      ES2 — skip_pending бросает (DB lock или disk error): пропагируется в slot loop,
            attempt_count++. Pending row остаётся. На следующем слоте guard опять сработает
