      R4 — K stale rows = K admin-пингов. При резко возросшем числе stale rows (массовая
      рассинхронизация БД) операторский Telegram забивается. Mitigation: документировать
      лимит K=5/тик; если стрельнёт — добавить throttling следующей итерацией.

      R5 — Регрессия в happy path: guard срабатывает на легитимном retry после Telegram-fail
      (Decision 9). Mitigation: guard проверяет published_articles, retry-сценарий по
