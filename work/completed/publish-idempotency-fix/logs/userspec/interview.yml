      EC4 — Несколько stale rows подряд: K строк → K admin-пингов. Без троттлинга.
            (При K>5/тик оператор разберётся ad-hoc.)
      EC5 — Pending row без link в published (нормальный случай): guard НЕ срабатывает,
            обычный путь.
      EC6 — Decision 9 retry (telegraph_url есть, link НЕ в published): guard НЕ срабатывает
            (проверка по published-table), Telegraph переиспользуется, Telegram повторяется
            — это штатно.
      EC7 — Link и в published, и в failed_articles одновременно (после ручных операторских
