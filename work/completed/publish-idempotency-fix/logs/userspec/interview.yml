  risks:
    score: 90
    status: "complete"
    value: |
      R1 — Guard ложно срабатывает: link есть в published_articles, но pending-row
      легитимная (например, операторски восстановили БД из бэкапа после rollback кода).
      Mitigation: admin-ping предупреждает — оператор увидит и решит. Probability LOW
