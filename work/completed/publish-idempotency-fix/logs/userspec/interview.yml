      EC9 — move_to_published повторно с тем же link (через job() как в инциденте):
            INSERT OR IGNORE skip'ает, DELETE pending выполняется — idempotent. (AC6)
      EC10 — move_to_published успешно завершился И конкурентный writer (теоретический
             hw_review архивный путь) сделал то же — finalize по двум путям. INSERT OR IGNORE
             на published обоих — последний выигрывает. processed_news — INSERT OR IGNORE.
             DELETE pending — оба DELETE по одному link. Race-safe.

      Сценарии вне scope (НЕ покрываются guard'ом):
      - Дубль РАЗНЫХ Telegraph URLs одной статьи (новая Telegraph-страница на каждом retry).
        Guard ловит по link, не по telegraph_url. В нашем инциденте это не проблема —
