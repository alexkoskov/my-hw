  feature_description:
    score: 85
    status: "partial"
    value: |
      Bug fix: цикл публикации в news_bot.job() публикует дубль в Telegram-канал,
      когда статья уже есть в published_articles, но stale-копия осталась в pending_articles
      с сохранённым telegraph_url. send_telegraph_teaser срабатывает до move_to_published,
      и если последний падает с UNIQUE constraint — пост уже ушёл подписчикам, slot loop
      инкрементит attempt_count и на следующем слоте повторяется.

      Фикс делает _fallback_publish и move_to_published идемпотентными по link:
      проверка published_articles ДО отправки в Telegram + защита от UNIQUE на INSERT.
    gaps: ""
    required: true

  work_type:
