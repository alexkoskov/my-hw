# ============================================================================
# Phase 1: High-Level Feature Understanding
# ============================================================================
# Interview Cycle 1 scope
phase1_feature_overview:

  feature_name:
    score: 100
    status: "complete"
    value: "t-hunted-pt-source"
    gaps: ""
    required: true

  feature_description:
    score: 95
    status: "complete"
    value: "Add t-hunted.blogspot.com as a 4th news source. Pipeline reuses the existing fetch → dedup → scrape → boilerplate → LLM transcreation → Telegraph → Telegram path. The only structural difference: source language is Portuguese (PT) instead of English. 4 extension points required: (1) new blogger-style scraper, (2) new branch in article dispatcher, (3) prompt update to accept PT input + per-source style note + PT-EN-RU glossary, (4) PT boilerplate patterns. No new pipeline, no new architecture, no headless browser."
    gaps: ""
    required: true

  work_type:
    score: 100
    status: "complete"
    value: "feature"
    gaps: ""
    required: true

  user_problem:
    score: 90
    status: "complete"
    value: "Channel coverage gap: existing 3 EN sources (autoevolution, lamley, orangetrack) miss the Brazilian Hot Wheels perspective. t-hunted covers HW Brasil exclusives (e.g. Pop Culture lines that ship to Brazil before global), photo-reviews of regional releases, and a different editorial angle on the same scene. Goal is content breadth, not just publishing frequency."
    gaps: ""
    required: true

  target_users:
    score: 80
    status: "complete"
    value: "Existing subscribers of the prod Telegram channel — Russian-speaking Hot Wheels collectors. No new audience segment; just richer feed for the current one."
    gaps: ""
    required: false

  success_criteria:
    score: 90
    status: "complete"
    value: |
      Measured 7 days after t-hunted lands in prod:
      1. Zero [E021]/[E024]-class admin alerts from t-hunted parser in the 7-day window (parser is stable).
      2. RU translation quality not worse than autoevolution baseline — operator subjective check on 5-10 t-hunted posts.
      3. Zero duplicate publishes to the channel that traceback to PT-vs-EN token-handling bugs.
      4. plan-of-day carry_over stays within norm (≤3 days backlog), no queue runaway.
    gaps: ""
    required: true

  constraints:
    score: 95
    status: "complete"
    value: |
      Hard "no" list:
      - No headless browser dependency (Mattel lesson — ~300MB deps, slow cron tick).
      - No new ENV vars — .env already loaded.
      - No restructuring of SOURCES registry — only an extra branch in the article dispatcher (news_bot.py:1414).
      - LLM cost budget: current ~$3/mo (OpenRouter openai/gpt-5.4-mini), allow up to +25% from t-hunted addition.
    gaps: ""
    required: true

  testing_strategy:
    score: 90
    status: "complete"
    value: |
      Feature size M → three layers:
      1. Unit tests:
         - blogger scraper on a captured t-hunted HTML fixture (title, body paragraphs, hero image extraction)
         - boilerplate filter on PT patterns (Compartilhar, Leia mais, Marcadores:)
         - prompt composition test: source_lang/source_name flows correctly into the LLM call
      2. Integration test: smoke pipeline tick with one EN + one PT entry in the same job() run — verify dedup, slot ordering, both publish without cross-language interference.
      3. No E2E. Operator visually verifies first t-hunted posts on the test channel via the standard `git push dev` → deploy_test cycle.
    gaps: ""
    required: true

# ============================================================================
# Phase 2: User Experience & Scenarios
# ============================================================================
# Interview Cycle 2 scope (together with Phase 3)
phase2_user_experience:

  user_stories:
    score: 90
    status: "complete"
    value: |
      Subscriber-side flow (the only user-facing actor — no operator UI in this feature):

      1. Brazilian collector blogger publishes a new post on t-hunted.blogspot.com (e.g. "Mais fotos da série Pop Culture 2026").
      2. Next 10:00 МСК cron tick picks up the entry via feedparser (the t-hunted RSS URL was added to feeds.json).
      3. t_hunted_source.fetch_t_hunted_article scrapes title + body paragraphs + 3-5 inline images from .post-body / .entry-content.
      4. boilerplate_filter strips Blogger footer noise (Marcadores:, Compartilhar no Facebook, etc).
      5. _fallback_publish stages the row; LLM transcreates PT → RU using the shared ux-guidelines.md system prompt (now with widened input-language + #🟤 t-hunted per-source block + PT-EN-RU glossary).
      6. Telegraph page created with hero image + RU body. Telegram channel post emits "#thunted #news" with INSTANT VIEW preview card.
      7. Subscriber sees the preview card in feed indistinguishable from autoevolution/lamley posts — same shape, RU translation, tap opens Telegraph.

      No special "🇧🇷 Brazilian perspective" marker on the post — operator decision: source attribution travels via the hashtag (#thunted), no extra UI signal needed. Subscribers don't need to know the post originated in PT — that's an implementation detail.
    gaps: ""
    required: true

  acceptance_criteria:
    score: 90
    status: "complete"
    value: |
      8 testable criteria (operator approved Cycle 2 batch 1):
      1. RSS feed t-hunted.blogspot.com is added to feeds.json; feedparser parses without errors; under cap=5.
      2. t_hunted_source.fetch_t_hunted_article(link, session, notifier) returns {title, subtitle, paragraphs, images} or None — same shape as lamley.
      3. SSRF allowlist hard-locked to ('t-hunted.blogspot.com',) — no glob, exact match.
      4. Article dispatcher (news_bot.py:1414-1439) routes via 'blogspot.com' in domain branch to fetch_t_hunted_article.
      5. _resolve_source_name returns 't-hunted' for t-hunted.blogspot.com netloc; NETLOC_TO_SOURCE map extended; source_name flows to LLM payload without code changes in *_transcreation.py.
      6. Telegram channel post emits exactly "#thunted #news" — special-case in _source_hashtag for blogspot subdomain (or override map keyed by source_name).
      7. ux-guidelines.md: input-language assertion widened to accept PT; new ### 🟤 t-hunted per-source style block; new PT-EN-RU glossary section between Per-source notes and Red flags.
      8. After 7 days on test channel: operator subjectively confirms RU translation quality ≥ autoevolution baseline on 5-10 sample posts.
    gaps: ""
    required: true

  edge_cases:
    score: 90
    status: "complete"
    value: |
      Wait-and-see (acceptable risk, monitor first):
      - R3: Blogger image URLs not dedup'd by lamley's base-split logic (=s1600 vs =s640 in path, not query). Start with lamley logic verbatim; tighten if duplicates appear in first 10 posts.
      - R4: Long PT essay paragraphs >4000 chars triggering _truncate_paragraphs warning. Monitor; raise cap if it fires often.
      - R5: PT boilerplate patterns applied globally (no language tag in _BOILERPLATE_PATTERNS). Same precedent as 2026-05-08 RU defence-in-depth block — length bound + ^-anchored regexes protect EN/RU streams.
      - R6: feedparser bozo flag on slightly-malformed Blogger XML. Existing behaviour (WARN + continue) — no fix.
      - R8: PT-EN-RU glossary baseline is partial (code-researcher proposed 10 entries). Iterate after operator sees first 5-10 publishes; not blocking.

      Pre-emptive fix (in scope):
      - R1+R2: Hashtag = #thunted (Telegram doesn't accept hyphens). _source_hashtag patched OR per-source override map; netloc-based naive fallback would emit #blogspot. Hard requirement of AC6.
      - R7: New t_hunted_source.py must be added to ALL THREE FILES lists (deploy.sh + deploy.yml + deploy_test.yml). Pre-deploy QA verifies all three.
    gaps: ""
    required: true

  error_scenarios:
    score: 90
    status: "complete"
    value: |
      | Scenario | Behaviour |
      |---|---|
      | RSS feed t-hunted.blogspot.com unreachable | _fetch_rss_entries catches requests.RequestException → admin alert [E002] generic source-fetch-failed → next cron tick retries |
      | Hostname not in SSRF allowlist (defensive — shouldn't happen via RSS) | fetch_t_hunted_article returns None → admin alert [E031] t-hunted host rejected → entry dropped |
      | Parser cannot find .post-body / .entry-content | None → admin alert [E033] t-hunted no body → entry dropped |
      | HTTP 5xx/timeout on article fetch | None → admin alert [E032] t-hunted fetch error → 3-strike attempt counter handled by pipeline (same as lamley) |
      | LLM returns mostly PT/EN output (_is_mostly_russian False) | ClaudeTranscreationError → per-article Google Translate fallback → post publishes with ↳ автоперевод marker on Telegraph page |
      | Long PT essay paragraph >4000 chars | _truncate_paragraphs logs WARNING, post still publishes (no error) |
      | Same Hot Wheels release covered by t-hunted AND autoevolution/lamley | KNOWN LIMITATION — handled by separate cross-source-content-dedup feature (not in scope) |
      | Blogger XML feedparser bozo flag | Existing WARN+continue behaviour, no change |
      | Image URL dedup misses Blogger =s1600 vs =s640 variants | Wait-and-see — start with lamley logic, tighten if dupes observed in first 10 posts |
    gaps: ""
    required: true

  verification_strategy:
    score: 85
    status: "complete"
    value: |
      Two stages:

      Pre-deploy (agent / pytest, gateable by CI):
      - All unit tests in tests/test_t_hunted_source.py green.
      - tests/test_sources_registry.py extended NETLOC_TO_SOURCE assertions green.
      - tests/test_telegram.py extended with test_t_hunted_teaser_appends_news_tag — locks hashtag spelling.
      - tests/test_boilerplate_filter.py extended with TestIsBoilerplatePositive::test_portuguese_patterns_filtered.
      - All three FILES lists (deploy.sh, deploy.yml, deploy_test.yml) include t_hunted_source.py.

      Post-deploy (operator, on test channel @myhwchannel123):
      - First t-hunted post lands within 24-48 hours of merge to dev.
      - Visual checklist on test channel: (a) Telegram preview card with hero image, (b) hashtag renders correctly as #thunted (no truncation), (c) Telegraph page has full body in RU, (d) no PT phrases leaked into RU output, (e) emoji prefix on title.
      - First 5-10 posts: operator spot-checks RU translation quality against original article (subjective).
      - 7-day stability check: zero [E021-E034] admin alerts traceback to t-hunted parser.
      - dev → main promotion only after positive verification on test instance.
    gaps: ""
    required: true

  ui_ux_requirements:
    score: 0
    status: "pending"
    value: ""
    gaps: "Specific UI/UX requirements if applicable"
    required: false

  risks:
    score: 90
    status: "complete"
    value: |
      Risk register (severity grading from code-research.md §13):

      HIGH:
      - R1 (Telegram hashtag rejects hyphens) → mitigation: hashtag spelling locked to #thunted in AC6, test_telegram.py invariant.
      - R2 (_source_hashtag returns #blogspot by default) → mitigation: special-case patch in news_bot.py OR per-source override map.

      MEDIUM:
      - R3 (Blogger image URL dedup) → wait-and-see, fix if dupes observed.
      - R7 (deploy FILES list — one of three forgotten) → INVARIANT comment + pre-deploy checklist.
      - R8 (PT-EN-RU glossary is provisional) → iterate based on first 5-10 publishes.
      - Cross-source content dedup is a KNOWN limitation — same release may publish twice (autoevolution + t-hunted on same Hot Wheels release). Separate feature cross-source-content-dedup planned next (Cycle 1 batch 2 decision).

      LOW:
      - R4 (4000-char truncation on long PT essays) → monitor _truncate_paragraphs WARNINGs.
      - R5 (PT boilerplate cross-applied to EN/RU) → length-bound + word boundaries same as RU precedent 2026-05-08.
      - R6 (Blogger malformed XML / bozo flag) → existing WARN+continue behaviour.
    gaps: ""
    required: true

  technical_decisions:
    score: 90
    status: "complete"
    value: |
      D1: Hashtag = #thunted (not #t-hunted: Telegram rejects hyphens; not #blogspot: default _source_hashtag behaviour, would clash with future blogspot sources). Patch _source_hashtag with a blogspot-subdomain special case OR add a source_name-keyed override map.
      D2: Blueprint = lamley_source.py (minus WAF/throttle apparatus). Reasoning: HTML structure closest to Blogger (flat .entry-content), simplest signature surface, ~150 LOC vs orangetrack's 700+. Autoevolution would force Cloudflare+blocks complexity not needed for Blogger.
      D3: Dedicated admin alerts E031-E033 (host-rejected / fetch-error / no-body) rather than reusing generic [E002] alert_source_fetch_failed. Three is enough — operator triage benefits from named alerts, four (lamley's count) would be overkill.
      D4: 🟤 emoji for t-hunted in SOURCE_EMOJI (only "warm" circle remaining, doesn't clash with orange/purple/green/blue used by other sources). Cosmetic for archived hw_review only.
      D5: PT boilerplate patterns added globally to _BOILERPLATE_PATTERNS (no per-language tagging). Length-bound 120-char + ^-anchored regexes provide false-positive safety, mirroring the 2026-05-08 RU defence-in-depth precedent.
      D6: No language tagging in feeds.json. _resolve_source_name infers source from netloc; LLM auto-detects PT from content. Per-feed lang shape would be a separate refactor.
    gaps: ""
    required: false

  deploy_approach:
    score: 90
    status: "complete"
    value: |
      Standard project flow per .claude/skills/project-knowledge/references/deployment.md:

      1. Implementer creates feature/t-hunted-pt-source branch from origin/dev.
      2. Single atomic PR with all ~15 file edits (parser+dispatcher+prompt+boilerplate+tests+3 deploy lists). Feature works fully or not at all; partial deploys risk ImportError on cron tick.
      3. Pre-deploy gate: pytest tests/ green locally + CI green on PR.
      4. PR squash-merged to dev.
      5. deploy_test.yml fires via workflow_run → SCPs files to /home/hwbot/bot_test/ → restarts news_bot_test.service.
      6. Operator observes 5-10 first t-hunted posts on @myhwchannel123 over 2-7 days (visual checklist from verification_strategy).
      7. On green light → merge dev → main → deploy.yml → prod (/home/hwbot/bot/ + news_bot.service).
      8. After 7 days of clean prod operation (zero [E031-E033] alerts, RU quality OK) → /done command archives feature folder to work/completed/.

      NO new infrastructure: no env vars, no new GitHub secrets, no new deps, no schema migration. Cron schedule unchanged. Rollback: git revert + push (standard, ~2-3 min per docs).
    gaps: ""
    required: false

  manual_user_actions:
    score: 80
    status: "complete"
    value: |
      Operator side (one-off):
      - Add the t-hunted RSS URL to feeds.json BEFORE merging (or in the PR itself).
      - Observe @myhwchannel123 first 5-10 t-hunted publishes — visual checklist (hero image, hashtag spelling, RU quality, no PT leakage).
      - Optionally tune the PT-EN-RU glossary in ux-guidelines.md after seeing real translations (iterate as separate small PR).

      No new API keys, no bot setup (existing bot covers both channels), no DB migration, no new ENV vars to set on the server.
    gaps: ""
    required: false

  ui_ux_requirements:
    score: 90
    status: "complete"
    value: |
      No UI changes. Channel post visual layout stays byte-identical to existing sources: single hashtag line + INSTANT VIEW preview card. Telegraph page layout reuses the standard hero+subtitle+body+footer template. No "🇧🇷 Brazilian perspective" or other source-distinguishing marker per user_stories — attribution via hashtag (#thunted) suffices.
    gaps: ""
    required: false

