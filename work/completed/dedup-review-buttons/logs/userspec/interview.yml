# Interview Plan for Feature Planning
#
# Tracks progress of adaptive discovery interview for a new feature/bug/refactoring.
# Updated after EACH user response with scoring, values, and remaining gaps.
#
# Scoring: 0-100% (how well we understand this aspect)
# Status: pending → partial → complete
# Required: true = must reach threshold, false = cover if relevant

# ============================================================================
# Interview Metadata (Session Recovery)
# ============================================================================
interview_metadata:
  started: "2026-07-22 14:08:43"  # Timestamp (YYYY-MM-DD HH:MM:SS)
  last_updated: "2026-07-22 14:08:43"
  status: "completed"  # not_started | in_progress | completed
  can_resume: true
  current_question_num: 1
  feature_size: "M"  # S | M | L — reassessed from S: first-ever inbound Telegram handling, new listen loop, SQLite concurrency, auth, shared-token 409 constraint

# ============================================================================
# Conversation History (for session recovery)
# ============================================================================
# Preserves complete Q&A. Update after EVERY user response.
#
conversation_history:
  - question_num: 1
    timestamp: "2026-07-22 14:08:43"
    topic: "buttons / missed-window / feedback"
    agent_question: |
      Батч 1 (AskUserQuestion): (a) какие кнопки под E014? (b) поведение,
      если статья уже вышла? (c) как показать, что нажатие сработало?
    user_answer: |
      (a) «Не публиковать» + «Оставить» (две кнопки).
      (b) Написать «Уже опубликовано» (отменить нельзя).
      (c) Заменить кнопки на статус (✅ Отменено / 👍 Оставлено).
    summary: "2 кнопки; missed-window → сообщение; feedback → edit message на статус."
  - question_num: 2
    timestamp: "2026-07-22 14:08:43"
    topic: "instances / shared-token 409"
    agent_question: |
      Один бот-аккаунт на прод и тест; слушать getUpdates может только один
      (иначе Telegram 409 Conflict). Как поступаем?
    user_answer: |
      Слушает только прод.
    summary: "Только прод-инстанс включает listen-loop; тест кнопки не слушает."
  - question_num: 3
    timestamp: "2026-07-22 14:08:43"
    topic: "code-research findings (subagent)"
    agent_question: "(авто) разбор кода интеграционных точек"
    user_answer: |
      code-research.md готов. Ключевое: skip_pending(link) — готовая атомарная
      отмена; PK очереди = link (URL) → callback_data 64б не влезает, нужен
      короткий id/токен; publish-loop перечитывает list_pending каждый слот →
      удаление строки до слота достаточно; PTB 21.10 async, sends через
      asyncio.run, постоянного Application нет → нужен фоновый поток c getUpdates;
      skip_pending на bare sqlite3.connect без busy_timeout → закрыть риск
      «database is locked»; TELEGRAM_ADMIN_ID по умолчанию @username, а
      callback.from_user.id числовой → нужен числовой admin-id для auth.
    summary: "Интеграционные точки и 3 подводных камня зафиксированы для тех-спека."
# Format:
# - question_num: 1
#   timestamp: "2025-11-12 15:20:33"
#   topic: "user_problem"
#   agent_question: |
#     [Full question text]
#   user_answer: |
#     [Full answer text]
#   summary: "Brief summary"

# ============================================================================
# Phase 1: High-Level Feature Understanding
# ============================================================================
# Interview Cycle 1 scope
phase1_feature_overview:

  feature_name:
    score: 100
    status: "complete"
    value: "dedup-review-buttons"
    gaps: ""
    required: true

  feature_description:
    score: 70
    status: "partial"
    value: >
      Под алертом «[E014] Похож на дубль» (и ТОЛЬКО под ним) добавить
      инлайн-кнопки в Telegram, чтобы оператор одним нажатием из чата убрал
      подозрительную новую статью из очереди до её публикации. Сейчас бот
      только отправляет и не принимает никаких входящих (нет getUpdates /
      обработчиков) — фича впервые вводит «слушание» нажатий.
    gaps: "Уточнить набор кнопок, обратную связь после нажатия, поведение при упущенном окне"
    required: true

  work_type:
    score: 100
    status: "complete"
    value: "feature"
    gaps: ""
    required: true

  user_problem:
    score: 85
    status: "complete"
    value: >
      Оператор получил алерт о возможном дубле и захотел отменить публикацию
      прямо из Telegram, но не смог — бот не принимает ответы. Единственный
      способ убрать статью — CLI hw_review.py на сервере, что оператору
      недоступно/неудобно с телефона. Ценность: быстрый контроль над спорной
      публикацией из чата, в окно между алертом (~10:00) и слотом публикации
      (15:00/19:30 МСК).
