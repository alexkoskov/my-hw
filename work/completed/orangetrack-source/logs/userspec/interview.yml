  error_scenarios:
    score: 90
    status: "complete"
    value: |
      ES1. /feed/ returns HTTP 5xx / 429 / connection refused → ping aggregator
        receives (FEED_HTTP_<status>, feed_url) tuple → 0 entries returned → continue
        to next feed. Subsequent cron ticks retry naturally.
      ES2. /feed/ times out → ping aggregator receives (FEED_TIMEOUT, feed_url) → 0
        entries → continue.
      ES3. /feed/ returns 200 but body is malformed XML → feedparser raises → caught →
