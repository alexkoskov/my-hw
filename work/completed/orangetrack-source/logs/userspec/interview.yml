      ES5. <content:encoded> missing for an entry → HTTP GET article URL → parse body:
        - GET succeeds + parse extracts paragraphs → article enters pending normally
          (SILENT — successful fallback).
        - GET 5xx/429/non-2xx → ping aggregator receives (ART_FALLBACK_HTTP_<status>,
          link) → skip this article.
        - GET timeout → ping aggregator receives (ART_FALLBACK_TIMEOUT, link) → skip.
        - GET 200 but parse extracts nothing → ping aggregator receives
