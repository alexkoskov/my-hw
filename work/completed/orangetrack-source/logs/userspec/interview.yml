      TD10. source_name='orangetrack' (short, matches 'lamley' / 'mattel' truncation
        pattern); hashtag '#orangetrackdiecast' (from netloc, unchanged).
      TD11. RSS recovery semantics: rely on natural feed window + processed_news
        dedup; no special retry state. Rationale: simpler is more reliable;
        SLA of WP.com + Brad's posting rate make >5-day outage with >10 posts
