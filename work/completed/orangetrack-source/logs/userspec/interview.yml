      ES6. Unexpected exception during parse (any unforeseen branch): ping aggregator
        receives (ART_PARSE_EXCEPTION, link) → catch-all defensive code; news_bot's
        existing try/except in fetch_full_article also catches.
      ES7. End of cron tick: aggregator counts collected tuples. If empty → silent.
        Otherwise → format ONE admin-ping with summary + grouped bullet list per code,
        ordered by category (FEED_* before ART_*) then by code alphabetically.
      ES8. Throttle: rare given daily cadence, but if two same-tick HTML fallback
        fetches fire, MIN_REQUEST_INTERVAL_S throttle sleeps; 429 with Retry-After
        honored once before giving up (lamley pattern). 429 still gets a code in the
        aggregator (ART_FALLBACK_HTTP_429).
      ES9. Boilerplate filter regex compile failure (typo at module load): ImportError
        on cron startup. Mitigation: pytest catches this pre-deploy.
      ES10. Forgot to add orangetrack_source.py to BOTH FILES lists (deploy.sh AND
        .github/workflows/deploy.yml): server hits ImportError on next cron restart.
