# Updated after EACH user response with scoring, values, and remaining gaps.
#
# Scoring: 0-100% (how well we understand this aspect)
# Status: pending → partial → complete
# Required: true = must reach threshold, false = cover if relevant

# ============================================================================
# Interview Metadata (Session Recovery)
# ============================================================================
interview_metadata:
  started: "2026-05-05 09:55:00"
  last_updated: "2026-05-05 11:15:00"
  status: "completed"
  can_resume: false
  current_question_num: 3
  feature_size: "M"  # hybrid parser ~270-300 LoC (feed-first + HTML scrape fallback, blocks path for video preservation) + tests + boilerplate filter additions + admin-ping aggregator with error codes. No per-source ux-guidelines block in this feature. Lamley video support deferred to separate future feature. Throttle/retry deferred (no Lamley-style 429 risk for orangetrack — operator-driven rationale per adequacy-review).

# ============================================================================
# Conversation History (for session recovery)
# ============================================================================
# Preserves complete Q&A. Update after EVERY user response.
#
conversation_history:
  - question_num: 1
    timestamp: "2026-05-05 10:05:00"
    topic: "user_problem + arch decision + naming + acceptance criteria"
    agent_question: |
      Q1 (user_problem): зачем именно этот сайт сейчас? (a) канал хочет больше HW-контента —
        backlog часто пустой, 3 источника = ~7 публикаций/день, 4-й увеличит частоту;
        (b) качество — single-author HW-фокус, лучше Lamley/autoevolution; (c) случайная находка.
      Q2 (architecture): парсер feed-only (A, ~150 LoC, парсим content:encoded напрямую) или
        RSS+HTML scrape как Lamley (B, ~300 LoC) или гибрид (C, feed-first + scrape fallback)?
        Предложение: A, поскольку content:encoded содержит полный HTML.
      Q3 (naming): source_name='orangetrack' (короткая метка по образцу 'lamley'), emoji 🔵
        (свободный из RGB), hashtag #orangetrackdiecast (от netloc, неизменяемо).
      Q4 (success criteria + testing): 6 AC (RSS fetch + dedup, статья в pending_articles,
        slot-публикация с #orangetrackdiecast хэштегом, Telegraph рендер, affiliate filter,
        all 740 + new ~30-40 tests). M-size: unit для парсера и boilerplate, без нового
        integration теста (общий путь покрыт test_distributed_schedule_integration.py).
    user_answer: "q1 a q2 a q3 ok q4 ok"
    summary: All 4 confirmed — (a) throughput driver, feed-only parser, naming/emoji/hashtag
      scheme accepted, M-size testing strategy with 6 AC accepted as baseline.

  - question_num: 3
    timestamp: "2026-05-05 10:50:00"
    topic: "video handling (blocks vs flat) + lamley video scope + admin-ping format"
    agent_question: |
      Q9 (video handling for orangetrack): Brad's posts often contain YouTube embeds.
        On flat parser path ({title, subtitle, paragraphs, images}) iframes are silently
        dropped. (A) keep flat path, accept video loss; (B) emit blocks-list (like
        autoevolution) to preserve video position. Recommendation: B — Brad's videos
        are integral to content; cost ~+50 LoC; size still M.
      Q10 (Lamley video by extension): operator initially asked to also fix Lamley video
        loss in same feature. Two scope options: (α) do both in this feature — wider
        scope, regression risk on Lamley; (β) split — orangetrack now (additive, low
        risk), Lamley video as a separate later feature. Recommendation: β.
      Q11 (admin-ping format): aggregated single-ping per cron tick with error codes
        and links. Codes: FEED_HTTP_<status> / FEED_TIMEOUT / FEED_XML_PARSE for
        feed-level; ART_FALLBACK_HTTP_<status> / ART_FALLBACK_TIMEOUT /
        ART_FALLBACK_PARSE_EMPTY / ART_PARSE_EXCEPTION for article-level. Format:
        '[<INSTANCE>] orangetrack: N issues this tick\\n  • CODE (k×) — <link>...'.
    user_answer: |
      Q9 = B (blocks path; video preserved in order — implied by Q10 phrasing
        "сделай, чтоб с lamley видео тоже парсилось").
      Q10 = β (split). Lamley video stays as separate future feature.
      Q11 = OK on the proposed format and code set.
    summary: |
      Architecture: orangetrack parser emits BOTH the flat path fields {title, subtitle,
      paragraphs, images} AND the blocks list — same dual contract autoevolution uses,
      so telegraph_publisher's existing block-or-flat renderer handles both gracefully
      (blocks path takes priority when present). Size grows from ~250 → ~270-300 LoC
      including blocks builder + tests; still M. Lamley parser stays untouched in this
      feature; Lamley video preservation will be a separate ~150 LoC feature later.
      Admin-ping wiring uses an aggregator helper that collects (code, link) tuples
      across the tick and fires once at end-of-source-fetch.
    agent_question: |
      Q5 (affiliate inline sentences inside paragraphs — Brad's 'QUICK LINK! Buy from <store>'
        ending real article paragraphs): (I) out of scope — accept the leak, fix later if observed;
        (II) extend _strip_plugs in news_bot.py with affiliate-cue regex (variant B postprocessor);
        (III) pre-LLM stripper in parser.
      Q6 (edge cases): WP block-class drift mitigation = walk by tag not class; video-only post →
        synthesize paragraphs=[entry.title]; carousel galleries → BS4 recursive find_all('img');
        post without images → render without hero.
      Q7 (error scenarios): HTTP 5xx/429/timeout on feed; malformed RSS XML; content:encoded
        missing → fall back to RSS description excerpt; WP markup change → exception → admin
        notify; affiliate-only post body → boilerplate strips → drop.
      Q8 (verification + manual user actions + risks): pre-deploy pytest green; post-deploy on
        dev → deploy_test.yml → test channel visual check → merge to main; no manual user
        actions; risks = WP drift (mitigated by walk-by-tag), affiliate inline leak (out of
        scope per Q5), FILES list invariant (manual checklist), test_sources_registry.py
        set-assert breaks (update in same commit), feed rate-limit (cron daily, no risk).
    user_answer: |
      Q5 = I (out of scope).
      Q6 = OK on all 4 sub-points.
      Q7 = OK on retry semantics (RSS naturally carries 10-20 recent posts, dedup against
        processed_news handles missed-fetch recovery automatically). NEW DECISION: when
        content:encoded is missing, switch to HTML scrape of the article page (NOT to RSS
        description excerpt). This shifts the architecture from option A (feed-only) to
        option C (feed-first + HTML scrape fallback). NEW ADMIN-PING REQUIREMENT: when the
        feed is unreachable (HTTP error / network / malformed XML) — admin-ping. When
        content:encoded missing AND HTML scrape also fails — admin-ping. When content:encoded
        missing but HTML scrape works — silent (fallback succeeded).
      Q8 = OK.
    summary: |
      Architecture shifts feed-only → feed-first hybrid (~+100 LoC for HTML scrape fallback).
      Admin-ping wiring added: feed unreachable OR full-fallback failure. 'Silent fallback when
      it works' principle preserved (no ping floods on transient WP markup hiccups). Risk R6
      added: HTTP scrape introduces 429/throttle risk if Brad's site rate-limits — mitigation
      = same lamley_source.py pattern (Retry-After respect + module-level interval). Q5 affiliate
      inline confirmed out of scope.
