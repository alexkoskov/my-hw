# ============================================================================
# Notes
# ============================================================================
notes: |
  ЗАМЕР ПО ПРОДУ (120 статей с отпечатками) ОПРОВЕРГ ОБА КАНДИДАТА-ПРИЗНАКА:

  1. «Размер отпечатка = подборка» — НЕ работает. «Boulevard Mix 4 Unboxing:
     Ferrari Enzo» имеет 90 пар и при этом является партнёром НАСТОЯЩЕГО дубля
     15.08 (t-hunted «mais fotos do lote Boulevard»). Запрет крупным отпечаткам
     быть донором убил бы этот true positive. При этом «11 New Collectibles»
     (28 пар) — источник ложных.

  2. «Покрытие меньшего отпечатка» — НЕ работает. У t-hunted-постов 1-2 пары,
     поэтому покрытие = 100% и у настоящего дубля 15.08, и у ложного 19.08
     (t-hunted «Ferrari F40 no Red Line Club» против подборки «11 New
     Collectibles»). Метрика одинаковая, вердикты противоположные.

  ЧТО ЗАМЕР ПОКАЗАЛ ПОЛОЖИТЕЛЬНОГО: признак по ЗАГОЛОВКУ («Unboxing: N…»,
  «N New…», «N Unsung…») корректно разделяет спорную пару 19.08 (подборка
  ловится) и настоящий дубль 15.08 (Boulevard Mix 4 Unboxing НЕ ловится —
  после «Unboxing:» идёт не число). Но он покрывает лишь часть: хабы «Last Car
  Culture Set» (56 пар, 6 флагов) и «Mooneyes Diorama» (40 пар, 4 флага) под
  шаблон не подходят.

  ВЫВОД ДЛЯ ТЕХСПЕКА: одиночного признака нет, нужна комбинация. Семантика,
  которую надо закодировать (формулировка оператора): подборка, упоминающая
  модель X, не является дублем отдельной статьи про X. Алгоритм — предмет
  тех-спеки; user-spec фиксирует ИЗМЕРИМЫЙ критерий приёмки на корпусе.

  Распределение: медиана пар у статей-подборок по заголовку 13 (max 296),
  у остальных 0 (max 90).

  НАЙДЕННЫЙ ПРИЗНАК (замер 19.08, кандидат для тех-спеки): флагать только если
  СЕРИЯ общей пары названа в ЗАГОЛОВКАХ ОБЕИХ статей. Смысл: общая линия должна
  быть заявленным предметом обеих публикаций, а не упоминанием внутри текста.

  Результат на историческом корпусе (вердикты оператора получены 19.08):
    - из 22 флагов правило оставило 2, убрало 20;
    - пара A (t-hunted «Novo lote Car Culture com carros alemaes» 21.07 против
      autoevolution «Last Car Culture Set for 2026» 18.07) — оператор: ДУБЛИ.
      Правило её сохраняет = верное срабатывание;
    - пара B («Car Culture 2-Pack Mix 4» против того же хаба) — оператор: НЕ
      дубли. Единственный оставшийся ложный флаг;
    - оба известных дубля вне этих 22 (отпечатки вычищены) тоже пойманы:
      14.08 team transport в обоих заголовках, 15.08 boulevard в обоих.

  ИТОГОВЫЙ СЧЁТ ПРАВИЛА: поймано 3 настоящих дубля из 3, ложных осталось 1
  вместо 21 за полтора месяца (~0.15/нед при цели <=1/нед). Пропусков нет.

  ВАЖНАЯ ПОПРАВКА К БАЗОВОЙ ЛИНИИ: «статья опубликована» НЕ равно «дублем не
  была». Пара A была опубликована ОБЕИМИ сторонами и при этом является
  настоящим дублем — то есть текущая система один реальный дубль уже
  пропустила в канал (оператор не нажал кнопку в шуме). Это усиливает
  обоснование фичи: шум не просто раздражает, он маскирует истинные
  срабатывания.

  ЧЕСТНОЕ ОГРАНИЧЕНИЕ: правило выведено на тех же 22 парах, на которых
  проверено — риск переобучения. Смягчающее обстоятельство: это не подобранное
  число, а семантический принцип. Проспективную проверку даст только прод.

  ИЗВЕСТНАЯ ДЫРА: правило опирается на заголовок. Пост t-hunted вида «Mais
  fotos do novo lote» без имени линии в заголовке даст пропуск.
  РЕШЕНИЕ ОПЕРАТОРА (19.08): дыру НЕ принимаем — страхуемся, доискивая имя
  линии в ПЕРВОМ АБЗАЦЕ, если в заголовке его нет. Область поиска предмета =
  заголовок + первый абзац.

  ПОПРАВКА ПОСЛЕ CODE-RESEARCH (19.08) — вопрос 4 батча 2 был задан на ложной
  предпосылке. Проверено в коде: admin_alerts.py:823-834 рендерит «Совпавшая
  серия/тема» всегда, когда pairs непуст, а _pair_match их всегда заполняет —
  значит при broad-флаге процент НЕ показывается, он остался только у легаси-
  backstop. Реально бесполезен оператору другой, ЗАХАРДКОЖЕННЫЙ текст в блоке
  «Что произошло» (admin_alerts.py:869-871): «статья прошла в очередь, потому
  что порог автоблокировки (50%) не достигнут» — печатается безусловно и к
  broad-ветке отношения не имеет. Требование переносится на него.

  РИСК ВТОРОГО ПОРЯДКА (найден code-research, подтверждён в news_bot.py:2845-
  2848): broad-флаг СЕЙЧАС терминален — backstop после него не запускается.
  Если новое правило скажет «не дубль», статья провалится в backstop, который
  при strict-overlap >=0.50 даёт НЕОБРАТИМЫЙ хард-блок [E015]. То есть фича,
  задуманная как «меньше шума», может превратить мягкий флаг в потерю статьи.
  Прямо противоречит принципу architecture.md «broad => ничего необратимого».
  Требует решения ДО тех-спеки.

  ДАННЫЕ (code-research): заголовок доступен на ОБЕИХ сторонах бесплатно
  (article уже приходит в _check_cross_source_dedup и не читается; обе выборки
  кандидатов уже SELECT title). ПЕРВЫЙ АБЗАЦ — только у pending: у
  published_articles нет колонки paragraphs, тело выбрасывается в
  move_to_published. Вариант «положить заявленную линию в fingerprint» упирается
  в backfill_fingerprints._already_backfilled — идемпотентность завязана на
  наличие $.pairs, поэтому старые строки молча не обновятся.

  ХОРОШИЕ НОВОСТИ: португальский работает (проверено вживую — «Novo lote da
  série Car Culture» -> ['car culture'], названия линий Mattel не переводит);
  extract_series() уже принимает сырую строку и годится как примитив матчинга.

  ПРОВЕРКА ПОЛНОТЫ (19.08) вернула needs_more, 5 пробелов. Разбор:

  [ЗАКРЫТ ДАННЫМИ] Замер 3/3 и 1/21 был получен на TITLE-ONLY правиле, до
  добавления страховки первым абзацем — проверяющий справедливо заподозрил, что
  страховка расширит область поиска и вернёт часть ложных. ПРОВЕРЕНО вживую:
  шесть постов t-hunted из корпуса прогнаны через fetch_full_article +
  extract_series, сравнение «серии в заголовке» против «серии в первом абзаце».
  Первый абзац НЕ ДОБАВИЛ НИ ОДНОЙ новой серии ни в одном из шести случаев.
  Следствия двойные: (1) замер корпуса остаётся в силе для финального правила;
  (2) страховка на всех доступных данных ИНЕРТНА — в реальных постах t-hunted
  линия всегда уже названа в заголовке. Оставляем как защиту от будущей формы
  поста, но в тех-спеке это НЕ несущая часть, и тест на неё будет синтетическим.

  [ЗАКРЫТ ПРАВКОЙ] testing_strategy вводил в заблуждение фразой «интеграционные
  не нужны» — переписан, см. выше.

  [ЗАКРЫТ ЗАПИСЬЮ] Компромисс решения Р1: пара, отклонённая по предмету, больше
  не проверяется backstop вообще — в отличие от пар без общей серии, которые до
  него доходят. Теоретически настоящий дубль, отклонённый по предмету, но
  проходящий backstop по strict-overlap 30-50%, теперь пройдёт молча. Принято
  осознанно: backstop не сработал ни разу за 1.5 месяца, а альтернатива —
  необратимый [E015] — хуже. Ловится shadow-логом.

  [В ОБЪЁМ] Лог-строки news_bot.py:4398/4408/4438 печатают overlap %d%%, что
  для broad-ветки даёт 0-7% и путает единицы измерения с backstop. Правим
  вместе с текстом пинга.

  [ПРИНЯТ ОПЕРАТОРОМ 19.08] Побочный эффект на тайминг: каждый убранный ложный
  флаг убирает и 24-часовую отсрочку. ~20 статей за 1.5 месяца начнут выходить
  в тот же день, а не на следующий, конкурируя за 3 слота. Оператор согласен
  явно. Обоснование: очередь чаще пустая, чем переполненная (15.08 в ней было
  ноль), так что ускорение выхода — улучшение, а не давление на слоты.

  РЕШЕНИЯ ОПЕРАТОРА, батч 2:
    - backstop (Jaccard 30-50/50+) ОСТАВЛЯЕМ как есть, несмотря на 0
      срабатываний за 1.5 месяца. Не трогаем в этой фиче.
    - текст [E014] МЕНЯЕМ: «Совпадение моделей: N%» вводит в заблуждение
      (в новой логике процент ничего не решает) -> показывать реальную
      причину: общая линия и то, что она заявлена в обеих статьях.

# ============================================================================
# USAGE INSTRUCTIONS
# ============================================================================
#
# 1. INIT: Created by init-feature-folder.sh at work/{feature}/logs/userspec/interview.yml
#    Set metadata.started, metadata.status: in_progress
#
# 2. INITIAL SCORING: After user's free-form description, score ALL items
#    Detailed 80-95%, brief 50-70%, vague 20-40%, not mentioned 0%
#
# 3. INTERVIEW LOOP (save after EVERY response):
#    a) Find required items with score < 85% in current cycle scope
#    b) Ask 3-4 questions about different gaps
#    c) Propose solutions based on PK
#    d) User answers
#    e) Update: conversation_history, scores, values, gaps, metadata
#    f) Save immediately
#    g) Check stop criteria (score >= 85% AND structural: value filled, no TBD, gaps resolved)
#    h) Not done → repeat. Done → next cycle.
#
# 4. CYCLES:
#    Cycle 1: phase1_feature_overview items
#    Cycle 2: phase2_user_experience + phase3_integration items
#    Cycle 3: ALL items still below threshold (cleanup pass)
#
# 5. RESUME: If metadata.status is "in_progress"
#    Load, show conversation summary, resume from current state
#
# 6. COMPLETION: After user approves user-spec.md
#    Set phase4_completion.status: approved
#    Set metadata.status: completed
