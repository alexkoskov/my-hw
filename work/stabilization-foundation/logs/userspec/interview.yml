# Interview Cycle 1 scope
phase1_feature_overview:

  feature_name:
    score: 100
    status: "complete"
    value: "stabilization-foundation"
    gaps: ""
    required: true

  feature_description:
    score: 95
    status: "complete"
    value: >-
      Отдельный runtime-safety пакет: unconditional hermetic CI, fail-closed
      production startup при неверном config/DB/VPN route и устранение overdue
      повторного tick после blocking immediate job. Контентные правила, stateful
      alert delivery и большой рефакторинг news_bot.py не входят.
    gaps: ""
    required: true

  work_type:
    score: 90
    status: "complete"
    value: "bug"
    gaps: ""
    required: true

  user_problem:
    score: 90
    status: "complete"
    value: >-
      Маленький production-бот накопил сложность и несколько опасных режимов:
      CI может быть ложно-зелёным, процесс может продолжить работу с пустой БД
      или до установки VPN-маршрута, рестарт способен породить второй tick, а
      не доставленный alert местами считается доставленным. Это создаёт риск
      дублей, потери состояния и незаметных сбоев.
    gaps: ""
    required: true

  target_users:
    score: 85
    status: "complete"
    value: >-
      Оператор production-бота; подписчики канала получают косвенную пользу от
      отсутствия дублей, пропусков и аварийных публикаций.
    gaps: ""
    required: false

  success_criteria:
    score: 95
    status: "complete"
    value: >-
      Любое tracked-изменение запускает полный offline suite независимо от .env;
      production не запускает Python job/API calls и не изменяет DB при неверном
      config, DB или default route; blocking immediate job не порождает overdue
      repeat, canonical 10:00 quick-start tick и restart recovery сохраняются.
    gaps: ""
    required: true

  constraints:
    score: 95
    status: "complete"
    value: >-
      Не менять читательский формат, дедуп-правила и approved-задачу
      dedup-broad-precision; не выполнять production deploy; не смешивать пакет
      с модульным переписыванием news_bot.py, off-box backup, publication
      crash-gap или reliable-admin-alert-delivery. Empty-DB authorization строго
      one-use и никогда не обходит wrong path/mount/corrupt SQLite.
    gaps: ""
    required: true

  testing_strategy:
    score: 95
    status: "complete"
    value: >-
      Unit-тесты обязательны. Интеграционные тесты нужны для чистого env,
      startup guards и lifecycle scheduler.
      Live E2E с production Telegram/VPN не планируется: проверяем локальными
      doubles, Docker/Compose config и существующим полным suite.
    gaps: ""
    required: true

