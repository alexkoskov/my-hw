# ============================================================================
# Decision Rules
# ============================================================================
decision_rules:

  required_threshold: 85
  optional_threshold: 50

  # Stop criteria (BOTH must be true to exit a cycle)
  stop_criteria:
    - "All required items in current cycle scope score >= 85%"
    - "Structural: every required item has non-empty value, no TBD, gaps empty or conscious limitations"

  priority_order:
    - "Required items with score < 85% (lowest score first)"
    - "Optional items mentioned by user in context"
    - "Other optional items if user seems knowledgeable"

notes: |
  CODE RESEARCH 2026-08-25:
  - CI check-skip смотрит только HEAD~1..HEAD и считает все *.txt docs, поэтому
    requirements changes и runtime .claude/.../ux-guidelines.md могут не запустить tests.
  - import-time load_dotenv маскирует порядок-зависимый Telegraph test; job tests
    при локальном ключе способны сделать два live OpenRouter balance GET.
  - route-setup меняет default route после запуска news-bot; main успевает открыть
    SQLite и выполнить Telegraph/LLM/Telegram calls до DB warning-only guard.
  - DB_FILE и INSTANCE_LABEL сейчас зависят от hand-managed .env; compose их не pins.
  - cron регистрируется до blocking immediate job, поэтому overdue 10:00 entry
    запускает второй tick после возврата. Persistent daily marker запрещён: он
    ломает mid-window restart recovery remaining slots.
  - E014 mint/send/rate-limit происходят до insert_pending. send=False всё равно
    расходует 7-day marker и через 24h разрешает публикацию; crash/callback race
    создаёт dead buttons. Надёжная семантика требует durable row+token+retry.
  - E016/E038/outage delivery markers тоже продвигаются после False. E017 уже
    реализует правильный mark-only-on-True pattern. E036 принадлежит approved
    operator-blind-spots и в этот scope входить не должен.
  - Latest user decision по failed E014 supersedes старое «silence publishes in
    24h» из approved dedup-broad-precision; precision logic менять нельзя, а
    sequencing/supersession нужно записать явно.
  - РЕШЕНИЕ 2026-08-25: весь stateful alert workflow вынесен в отдельный
    reliable-admin-alert-delivery. Текущая stabilization-foundation = CI +
    startup/config/DB/VPN + scheduler, size M. Alert findings сохраняются только
    как handoff и сознательное out-of-scope.
  - COMPLETENESS CHECK 2026-08-25: independent checker returned status=complete,
    confidence=high, gaps=[]; all required interview fields are structurally
    complete and the alert-delivery boundary is explicit.
  - VALIDATION ROUND 1 2026-08-25: последующее adequacy-исследование обнаружило
    скрытую сложность transport-independent network isolation и fail-closed
    volume/bootstrap protocol. Scope не изменён, но текущая оценка supersedes M:
    feature = L с тремя отдельно зелёными и откатываемыми increments. Draft
    уточнён через exact volume identity, DB-state matrix, UUID permit lifecycle,
    config matrix и scheduler equality boundary; пользователь подтвердит это при
    approval user-spec.
  - VALIDATION ROUND 2 2026-08-25: validators подтвердили исправление round-1
    blockers, затем нашли reachability contradiction для post-bootstrap DB с
    empty ledger + другим state и offline-unverifiable live-endpoint oracle.
    Выбрана строгая семантика: fresh permit годится только для четырёх eligible
    DB shapes, иначе manual data-aware restore/cleanup. Добавлены dedicated
    APP_MODE, test-owned egress sentinel, exact non-atime file invariants и
    DB/BOOTSTRAP fatal-event acceptance coverage.
  - VALIDATION ROUND 3 2026-08-25: оба validator verdict = approved, critical=0.
    Перед финальным коммитом закрыты оставшиеся major findings: sidecar-bearing
    DB non-overridable даже с permit, malformed permit = invalid_permit и exact
    earliest-gate ownership ROUTE→VOLUME→CONFIG→DB→BOOTSTRAP. Формальный size
    warning (>10 AC, >5 integrations) принят и соответствует L/increments.

  question_strategy:
    - "3-4 questions per batch about different gaps"
    - "Run as many batches as needed — batch size is NOT cycle limit"
    - "Propose solutions based on PK, not just ask questions"
    - "Challenge with substance: counterexamples, code references, unexplored scenarios"
