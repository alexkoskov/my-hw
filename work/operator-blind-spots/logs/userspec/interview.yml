# ============================================================================
# Notes
# ============================================================================
notes: |
  - TWO agent errors corrected before the interview started, both stated to the
    operator: (a) claimed entries carry no source marker and all four source
    modules would need changing — false, _resolve_source_name(link) exists and is
    already used at news_bot.py:4386 and :4545; (b) treated the [E036] re-mint as
    an open design fork — architecture.md:420 already recorded reminders as
    explicitly rejected. Sub-feature 1 shrank accordingly.
  - The operator chose the previously-rejected shape (daily repeat) WITH the
    rejection restated in the question. Treat as a decision, not an oversight.
    architecture.md:420 must be rewritten when this lands, or the next reader
    will undo the feature as a mistake.
  - Noise is the governing constraint for both halves. Every scope choice in this
    interview (one summary not N, terse wording, no per-source lines in [E008])
    was made against it.
  - Scope grew by one small item in batch 3: [E017] gets the same send marker.
    Same defect class, and we made it more visible last week by lowering its
    threshold 3→2.
  - Ordering coupling to pin with a test: the day-2 silence alarm reads evidence
    that the day-3 fetch-retry cap destroys. One day of margin.
  - PROCESS DEVIATION: this session forbids spawning subagents unasked, so
    code-research.md was written by the orchestrator reading the code directly
    instead of by the code-researcher subagent. The dual validators
    (userspec-quality-validator / userspec-adequacy-validator) in Phase 8 are
    pending an explicit decision from the operator — their value is independence,
    which the orchestrator cannot supply for its own document.
