      - admin_alerts.py — two new alert builders + one new keyboard builder;
        free codes: E029 (gap in sequence), then E039/E040.
      - pending_articles_repo.py:1000 list_held; :1633/:1666/:1708 token store;
        :686/:721 the rate-limit precedent to copy.
      - _review_listener_enabled() — fail-closed gate for the summary's buttons.
    gaps: ""
    required: true

  dependencies:
    score: 85
    status: "complete"
    value: |
      No new packages. Depends on shipped work: the content gate ([E036], hold
      buttons, review listener, 2026-07-25) and the fetch-retry cap (2026-08-13,
      whose day-3 retirement bounds the day-2 alarm).
    gaps: ""
    required: false

  technical_constraints:
    score: 85
    status: "complete"
    value: |
      - Telegram callback_data limit 64 bytes: `hd:a:` + token_urlsafe(9) ≈ 17
        bytes, so a multi-row summary keyboard fits, but the row count needs a
        cap rather than being unbounded.
      - Two opposing failure stances in one feature: alerting fails OPEN, button
        minting fails CLOSED. The tech-spec must state which governs which branch.
      - _format_funnel is operator-facing text; the per-source breakdown belongs
        in the new alert, not in [E008].
    gaps: ""
    required: false

  data_requirements:
    score: 85
    status: "complete"
    value: |
      Cross-tick state in bot_state (key/value, no migration): per-source
      "nothing staged since" counters and three send markers. Alternative — a
      dedicated table, as fetch_failures did — is open for the tech-spec, but
