    gaps: ""
    required: false

  migration_needs:
    score: 85
    status: "complete"
    value: |
      None if bot_state is used (key/value, no schema change). If a table is
      chosen instead, it follows the CREATE TABLE IF NOT EXISTS pattern in
      init_schema, like fetch_failures. Existing rows are unaffected either way;
      a cold start simply has no counters and raises nothing.
    gaps: ""
    required: false

