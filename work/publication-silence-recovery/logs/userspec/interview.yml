# Interview Plan for Feature Planning
#
# Tracks progress of adaptive discovery interview for a new feature/bug/refactoring.
# Updated after EACH user response with scoring, values, and remaining gaps.
#
# Scoring: 0-100% (how well we understand this aspect)
# Status: pending → partial → complete
# Required: true = must reach threshold, false = cover if relevant

# ============================================================================
# Interview Metadata (Session Recovery)
# ============================================================================
interview_metadata:
  started: "2026-08-25 23:02:59"  # Timestamp (YYYY-MM-DD HH:MM:SS)
  last_updated: "2026-08-25 23:19:39"
  status: "in_progress"  # not_started | in_progress | completed
  can_resume: true
  current_question_num: 2
  feature_size: "M"  # S | M | L

# ============================================================================
# Conversation History (for session recovery)
# ============================================================================
# Preserves complete Q&A. Update after EVERY user response.
#
conversation_history:
  - question_num: 1
    timestamp: "2026-08-25 21:44:00"
    topic: "production_incident"
    agent_question: >-
      Пользователь сообщил внешний [watch]-алерт о суточной тишине и попросил
      разобраться с контейнером, очередью и возможным решением в ревью.
    user_answer: >-
      В Telegram пришёл [watch] 🟡 «Больше суток нет публикаций» с подсказкой
      проверить docker ps, pending_articles и отмену единственной статьи дня.
    summary: >-
      Подтверждён production-инцидент: контейнер и heartbeat здоровы, но статья,
      освобождённая кнопкой «Оставить», потеряла все оставшиеся слоты дня.
  - question_num: 2
    timestamp: "2026-08-25 22:56:00"
    topic: "scope_and_process"
    agent_question: >-
      Исправляем scheduler/review race, покрываем watchdog временными тестами и
      проводим всё через полный проектный flow без ручной публикации и deploy?
    user_answer: "делай; сначала напиши план работ, потом делай по флоу"
    summary: >-
      Подтверждён отдельный bug-flow с TDD, review, QA и PR; необратимые live
      действия остаются отдельным явным решением.
