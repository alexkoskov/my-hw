# ============================================================================
# Phase 1: High-Level Feature Understanding
# ============================================================================
# Interview Cycle 1 scope
phase1_feature_overview:

  feature_name:
    score: 95
    status: "complete"
    value: "publication-silence-recovery"
    gaps: ""
    required: true

  feature_description:
    score: 95
    status: "complete"
    value: >-
      Исправить потерю оставшихся фиксированных слотов, когда единственная
      статья временно скрыта publish_after и оператор снимает deferral после
      первого slot check; одновременно сделать timebase внешнего publication
      watch тестируемым и единым по Москве.
    gaps: ""
    required: true

  work_type:
    score: 100
    status: "complete"
    value: "bug"
    gaps: ""
    required: true

  user_problem:
    score: 95
    status: "complete"
    value: >-
      Кнопка «Оставить — выйдет в ближайший слот» меняет строку БД, но не
      гарантирует существование следующего slot opportunity. В результате
      здоровый бот молчит, готовая статья лежит до следующего дня, а внешний
      watch поднимает реальный alert.
    gaps: ""
    required: true

  target_users:
    score: 90
    status: "complete"
    value: >-
      Оператор production-бота, принимающий решения по [E014], и подписчики,
      которые должны получать одобренную статью в обещанный слот.
    gaps: ""
    required: false

  success_criteria:
    score: 90
    status: "complete"
    value: >-
      В воспроизведении 10:00 E014 -> keep через секунды статья публикуется в
      15:00, cancel никогда не публикует, silence сохраняет 24h defer, лимит
      три публикации в день не нарушается, а watcher не дёргается на UTC/MSK
      границах.
    gaps: ""
    required: true

  constraints:
    score: 90
    status: "complete"
    value: >-
      Сохраняются фиксированные слоты 10:00/15:00/19:30 МСК, grace и <=3/day;
      hold_reason и cancel semantics не меняются; no live publish, restart,
      deploy, DB migration или новый внешний сервис внутри реализации.
    gaps: ""
    required: true

  testing_strategy:
    score: 90
    status: "complete"
    value: >-
      Unit-тесты для pure scheduling/watch time logic и интеграционный тест
      полного review-to-slot пути на реальной test SQLite; live E2E исключён,
      потому что единственный Telegram channel production и пост необратим.
    gaps: ""
    required: true

# ============================================================================
# Phase 2: User Experience & Scenarios
# ============================================================================
# Interview Cycle 2 scope (together with Phase 3)
phase2_user_experience:

  user_stories:
    score: 95
    status: "complete"
    value: >-
      Оператор получает [E014], нажимает keep после уже прошедшей утренней
      проверки, и статья выходит в следующий оставшийся фиксированный слот;
      cancel удаляет её без публикации. Для [E036] approve действует тот же
      scheduler-контракт, reject и молчание оставляют статью неопубликованной.
      Внешний watch один раз поднимает реальный publication alarm и не меняет
      состояние из-за UTC/MSK полуночи или неубедительного ответа Telegraph.
    gaps: ""
    required: true

  acceptance_criteria:
    score: 95
    status: "complete"
    value: >-
      E014 keep после пустого 10:00 read публикует ровно один раз в 15:00;
      E036 approve получает ту же гарантию; cancel/reject дают ноль публикаций;
      E014 silence сохраняет 24h defer и допускает строку в первый слот после
      expiry, E036 silence держит бессрочно; обычная очередь и план дня не
      получают фиктивных постов; за один job остаётся не более трёх фиксированных
      opportunities. Watch классифицирует границы 20:59/21:00, 00:00-03:00 и
      смену года с единого московского времени, а inconclusive не считается
      recovery.
    gaps: ""
    required: true

  edge_cases:
    score: 95
    status: "complete"
    value: >-
      Решение между первым пустым read и 15:00; решение после 19:30; restart в
      16:00; одновременные publish_after и hold_reason; одна обычная и одна
      withheld строка; все withheld строки отменены после планирования; deferral
      истекает через секунды после 10:00; пустая очередь без review backlog;
      watcher в 20:59/21:00, 00:00/02:59/03:00 МСК, Dec/Jan rollover, leap-day,
      пустой/битый/неожиданный Telegraph payload.
    gaps: ""
    required: true

  error_scenarios:
    score: 90
    status: "complete"
    value: >-
      Ошибка чтения reviewable backlog логируется и не создаёт дополнительный
      publish path; callback DB/auth/token failures сохраняют текущий fail-closed
      контракт; restart пересчитывает только оставшиеся фиксированные времена;
      API/JSON/path ambiguity в watch даёт inconclusive и не открывает и не
      закрывает publication alarm; ошибка доставки Telegram остаётся известным
      отдельным риском reliable-admin-alert-delivery.
    gaps: ""
    required: true

  verification_strategy:
    score: 95
    status: "complete"
    value: >-
      Сначала RED integration timeline на tempfile SQLite с реальными callback
      resolver и queue predicates, затем unit matrix чистой watch/scheduling
      логики, релевантные suites и полный pytest. Workflow проверяется статически
      и через тот же classifier без секретов. Live Telegram, Telegraph, restart,
      deploy и тестовый пост не выполняются; после будущего ручного rollout
      оператор сверяет один обычный цикл по логам и каналу.
    gaps: ""
    required: true

  ui_ux_requirements:
    score: 85
    status: "complete"
    value: >-
      Сохраняются существующие кнопки, авторизация и terminal-status. «Ближайший
      слот» всегда означает ближайшее ещё допустимое фиксированное время, включая
      10:00 следующего дня после вечернего cutoff; callback не публикует сразу.
      Watch alert сохраняет раздельные host/publication severity и не выдаёт
      «восстановилось» без убедительного evidence.
    gaps: ""
    required: false

  risks:
    score: 95
    status: "complete"
    value: >-
      Частичный фикс оставит гонку — проверяется полным timeline; wake slots могут
      исказить plan/carry-over — execution opportunities отделяются от обещанных
      публикаций; held backlog продлевает job до вечера — это bounded тремя
      временами и нужно для обещания approve; callback-side publish создаст
      конкуренцию и запрещён; watcher helper может разойтись с workflow — в
      production исполняется тот же источник; checkout увеличивает supply-chain
      поверхность — действие pin-ится и credentials не сохраняются; live E2E
      может создать необратимый пост — исключён.
    gaps: ""
    required: true

  technical_decisions:
    score: 90
    status: "complete"
    value: >-
      Оставляем фиксированные времена и одного publisher-а; сохраняем будущие
      opportunities для строк, которые способен освободить timer или оператор;
      пустая withheld-очередь пропускает текущую opportunity, а не завершает весь
      день; E014 и E036 исправляются симметрично; operator plan не изображает
      wake как гарантированный пост; watch получает одну тестируемую clock-based
      классификацию. Не вводим callback publish, DB migration, новый scheduler,
      persistent global cap, Telegraph replacement или durable alert delivery.
    gaps: ""
    required: false

  deploy_approach:
    score: 90
    status: "complete"
    value: >-
      Изменения идут dev -> обязательный PR -> main. Watcher начинает использовать
      исправление после merge в default branch без server deploy. Runtime bot
      разворачивает пользователь вручную через существующий Docker Compose вне
      окна 10:00-20:00 МСК; этот flow не выполняет merge, production rebuild или
      restart без отдельного явного решения.
    gaps: ""
    required: false

  manual_user_actions:
    score: 90
    status: "complete"
    value: >-
      Новые ключи, аккаунты, миграции и сервисы не нужны. После одобрения PR
      пользователь отдельно merge-ит и позже вручную rebuild/restart-ит production
      вне publish window; проверяет логи slot loop и первую естественную статью,
      не создавая тестовую публикацию.
    gaps: ""
    required: false

