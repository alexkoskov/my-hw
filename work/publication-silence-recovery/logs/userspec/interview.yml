  integration_points:
    score: 95
    status: "complete"
    value: >-
      Daily intake/job sizing и slot loop; SQLite eligibility predicates для
      pending/deferred/held; daemon review listener и E014/E036 callbacks;
      plan/quiet-day/recap/heartbeat observability; external GitHub Actions
      publication probe и issue-backed alarm state.
    gaps: ""
    required: true

  dependencies:
    score: 90
    status: "complete"
    value: >-
      Существующие Python schedule/pytz, SQLite repository, Telegram listener,
      Telegraph page-list API и GitHub Actions/Issues. Runtime dependency и
      внешний сервис не добавляются; workflow может использовать pinned checkout
      только для исполнения единственного repo-owned classifier.
    gaps: ""
    required: false

  technical_constraints:
    score: 95
    status: "complete"
    value: >-
      Только main thread публикует; review auth и token-kind gate остаются до DB
      mutation; фиксированные 10:00/15:00/19:30 МСК и 5-minute grace сохраняются;
      не более трёх execution opportunities на job; heartbeat остаётся после
      bounded loop; secrets watcher-а передаются только env и не попадают helper-у
      или fixtures; production — единственный channel без staging.
    gaps: ""
    required: false

  data_requirements:
    score: 95
    status: "complete"
    value: >-
      Используются существующие pending_articles.publish_after/hold_reason,
      review tokens и published_at; scheduler перед каждой retained opportunity
      перечитывает реальную SQLite eligibility. Watch использует только newest
      Telegraph page path и явное timezone-aware текущее время; секретный token
      остаётся в fetch step и не хранится в classifier state.
    gaps: ""
    required: false

  migration_needs:
    score: 100
    status: "complete"
    value: >-
      Миграция БД и преобразование существующих строк не нужны. Текущая готовая
      E014-строка автоматически подхватится обычным scheduler после будущего
      runtime rollout; в этом flow production row вручную не изменяется.
    gaps: ""
    required: false

# ============================================================================
# Phase 4: Completion
# ============================================================================
phase4_completion:
  userspec_file: "work/publication-silence-recovery/user-spec.md"
  status: "created"  # pending | created | approved

# ============================================================================
# Decision Rules
# ============================================================================
decision_rules:

  required_threshold: 85
  optional_threshold: 50

  # Stop criteria (BOTH must be true to exit a cycle)
  stop_criteria:
    - "All required items in current cycle scope score >= 85%"
    - "Structural: every required item has non-empty value, no TBD, gaps empty or conscious limitations"

  priority_order:
    - "Required items with score < 85% (lowest score first)"
    - "Optional items mentioned by user in context"
    - "Other optional items if user seems knowledgeable"

  question_strategy:
    - "3-4 questions per batch about different gaps"
    - "Run as many batches as needed — batch size is NOT cycle limit"
    - "Propose solutions based on PK, not just ask questions"
    - "Challenge with substance: counterexamples, code references, unexplored scenarios"
    - "After each response: update scores, values, gaps, conversation_history, save"

# ============================================================================
# Interview Progress
# ============================================================================
progress:
  current_phase: "phase8_userspec_validation"
  questions_asked: 2
  last_question: "Подтверждён отдельный bug-flow после письменного плана."
  total_required_score: 94
  total_optional_score: 91
  completion_estimate: "92%"
  user_detail_level: "moderate"  # brief | moderate | detailed

# ============================================================================
# Notes
# ============================================================================
notes: |
  - Production trace: 2026-08-25 10:00:31 [E014] staged one deferred row;
    slot 1/1 immediately saw list_pending() empty and broke; operator keep at
    10:00:42 cleared publish_after after job() had already returned.
  - At 21:44 the row was publishable with attempt_count=0; container running,
    restart_count=0, heartbeat and quick_check healthy. No cancel/reject log.
  - origin/main lacks 066500b while origin/dev contains it. The first 21:xx
    alert was honest; the old mixed UTC-date/MSK-hour logic can still create a
    false recovery at 00:00-02:59 and a duplicate alert after 03:00.
  - Manual publication and production deploy are explicitly outside this flow.
  - Code research found the same scheduler promise gap for [E036] approve;
    scope now covers both operator-release paths, without changing their gate
    semantics or publishing from the listener thread.
  - Existing global <=3/day is not backed by a persistent slot ledger across
    restarts. This bugfix preserves at most three fixed opportunities per job
    and does not claim to solve the broader restart-cap invariant.
  - Watch invalid/API responses are treated as inconclusive and must not be
    presented as proof of recovery; durable Telegram delivery remains separate.
  - Independent interview-completeness-checker verdict: complete/high confidence,
    no gaps across item coverage, logic, PK alignment, code findings or testing.

# ============================================================================
# USAGE INSTRUCTIONS
# ============================================================================
#
# 1. INIT: Created by init-feature-folder.sh at work/{feature}/logs/userspec/interview.yml
#    Set metadata.started, metadata.status: in_progress
#
# 2. INITIAL SCORING: After user's free-form description, score ALL items
#    Detailed 80-95%, brief 50-70%, vague 20-40%, not mentioned 0%
#
# 3. INTERVIEW LOOP (save after EVERY response):
#    a) Find required items with score < 85% in current cycle scope
#    b) Ask 3-4 questions about different gaps
#    c) Propose solutions based on PK
#    d) User answers
#    e) Update: conversation_history, scores, values, gaps, metadata
#    f) Save immediately
#    g) Check stop criteria (score >= 85% AND structural: value filled, no TBD, gaps resolved)
#    h) Not done → repeat. Done → next cycle.
#
# 4. CYCLES:
#    Cycle 1: phase1_feature_overview items
#    Cycle 2: phase2_user_experience + phase3_integration items
#    Cycle 3: ALL items still below threshold (cleanup pass)
#
# 5. RESUME: If metadata.status is "in_progress"
#    Load, show conversation summary, resume from current state
#
# 6. COMPLETION: After user approves user-spec.md
#    Set phase4_completion.status: approved
#    Set metadata.status: completed
