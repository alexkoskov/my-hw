# Interview Plan for Feature Planning
#
# Tracks progress of adaptive discovery interview for a new feature/bug/refactoring.
# Updated after EACH user response with scoring, values, and remaining gaps.
#
# Scoring: 0-100% (how well we understand this aspect)
# Status: pending → partial → complete
# Required: true = must reach threshold, false = cover if relevant

# ============================================================================
# Interview Metadata (Session Recovery)
# ============================================================================
interview_metadata:
  started: "2026-04-17 11:25:07"  # Timestamp (YYYY-MM-DD HH:MM:SS)
  last_updated: "2026-04-17 11:58:25"
  approved_at: "2026-04-17 13:14:02"
  status: "completed"  # not_started | in_progress | completed
  can_resume: true
  current_question_num: 2
  feature_size: "M"  # S | M | L

# ============================================================================
# Conversation History (for session recovery)
# ============================================================================
# Preserves complete Q&A. Update after EVERY user response.
#
conversation_history:
  - question_num: 1
    timestamp: "2026-04-17 11:49:51"
    topic: "feature_description, user_problem, success_criteria, constraints"
    agent_question: |
      Отлично, начинаем интервью. Сначала уточним детали.

      1. **Как именно ты хочешь получать новости с Facebook?**
         У страницы есть RSS-лента, или будем парсить HTML, или использовать Graph API?
         В проекте уже есть парсинг RSS, думаю, стоит добавить RSS-ленту Facebook, если она есть (например, через `https://www.facebook.com/feeds/page.php?format=atom&id=...`).
         Если нет, придется парсить HTML — это сложнее и менее надежно. Какой вариант предпочтительнее?

      2. **Какую проблему решает добавление Facebook?**
         Сейчас бот берет новости только с autoevolution.com. Добавление Facebook увеличит охват новостей? Или есть конкретная потребность в новостях именно с этой страницы?
         (Например, пользователи хотят видеть официальные анонсы Hot Wheels прямо из Facebook.)

      3. **Какие конкретные критерии успеха для этой фичи?**
         Например: бот должен каждые 24 часа проверять страницу Facebook на новые посты, извлекать текст и изображения, публиковать в Telegram.
         Или что-то ещё? Должны ли посты фильтроваться (только определенные типы контента)? Нужно ли переводить текст с английского, как сейчас?

      4. **Есть ли технические или бизнес-ограничения?**
         Facebook может блокировать парсинг, нужна авторизация. Будем использовать публичный RSS или потребуется создать приложение Facebook?
         Также нужно учесть лимиты запросов и возможные CAPTCHA. Есть ли ограничения по времени разработки?
    user_answer: |
      1) Как именно ты хочешь получать новости с Facebook? Давай на твое усмеотрение, я не разбираюсь в этом. 2) Какую проблему решает добавление Facebook? Хочу добавить новости с официальной страницы хотвиллс в фейсбук. 3) Какие конкретные критерии успеха для этой фичи? бот должен каждые 24 часа проверять страницу Facebook на новые посты, извлекать текст и изображения, публиковать в Telegram. Посты должны фильтроваться, отсеивай посты, где анонсируются ивенты. 4) Есть ли технические или бизнес-ограничения? Пока не знаю, ты мне скажешь какие ограничения. ВАЖНО! Используй флоу молянова при планировании и разработке. Поехали дальше, продолжаем интервью?
    summary: "Уточнены детали получения новостей с Facebook, проблема, критерии успеха и ограничения."
# Format:
# - question_num: 1
#   timestamp: "2025-11-12 15:20:33"
#   topic: "user_problem"
#   agent_question: |
#     [Full question text]
#   user_answer: |
#     [Full answer text]
#   summary: "Brief summary"

