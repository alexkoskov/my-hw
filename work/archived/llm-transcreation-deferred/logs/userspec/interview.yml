# Interview Plan for Feature Planning
#
# Tracks progress of adaptive discovery interview for a new feature/bug/refactoring.
# Updated after EACH user response with scoring, values, and remaining gaps.
#
# Scoring: 0-100% (how well we understand this aspect)
# Status: pending → partial → complete
# Required: true = must reach threshold, false = cover if relevant

# ============================================================================
# Interview Metadata (Session Recovery)
# ============================================================================
interview_metadata:
  started: "2026-04-22 10:35:00"
  last_updated: "2026-04-22 10:35:00"
  status: "in_progress"
  can_resume: true
  current_question_num: 0
  feature_size: "M"  # Replaces one function, touches news_bot.py + new module + tests; requires prompt engineering and config surface

# ============================================================================
# Conversation History (for session recovery)
# ============================================================================
# Preserves complete Q&A. Update after EVERY user response.
#
conversation_history: []
# Format:
# - question_num: 1
#   timestamp: "2025-11-12 15:20:33"
#   topic: "user_problem"
#   agent_question: |
#     [Full question text]
#   user_answer: |
#     [Full answer text]
#   summary: "Brief summary"

# ============================================================================
# Phase 1: High-Level Feature Understanding
# ============================================================================
# Interview Cycle 1 scope
phase1_feature_overview:

  feature_name:
    score: 95
    status: "complete"
    value: "llm-transcreation"
    gaps: ""
    required: true

  feature_description:
    score: 60
    status: "partial"
    value: |
      Replace Google Translate + regex post-processing in
      news_bot.transcreate_text with an OpenAI API call that performs
      adaptive retelling of article text into Russian, guided by a
      system prompt with user-supplied style parameters (tone, HW
      glossary, length, emphasis). Bundles a small Mattel filter
      expansion so both polishing passes land together.
    gaps: "Exact scope unclear: does LLM replace ALL of transcreate_text (emoji prefix, glossary, truncation, passive→active) or only the translation step with rule layer kept downstream?"
    required: true

  work_type:
    score: 95
    status: "complete"
    value: "feature"
    gaps: ""
    required: true

  user_problem:
    score: 75
    status: "partial"
    value: |
      Current pipeline produces mechanical Russian with calques
      ("Тур Legends"), wrong agreement ("в основной линейки"), stilted
      phrasing ("великий чемпион увидит, как его творение"), and
      glossary regex misses when Google returns mixed forms. User
      confirmed on 2026-04-22 dry-run over Mattel Masters-of-Universe
      article.
    gaps: "No acceptance of 'lively channel tone' has been precisely defined — what reads well vs what reads wrong?"
    required: true

  target_users:
    score: 80
    status: "complete"
    value: |
      Hot Wheels enthusiasts subscribed to @myhwchannel123 (from
      project.md target audience). Russian-first readers who want
      timely, readable coverage of HW news. No change from current
      audience — only the output quality improves.
    gaps: ""
    required: false

  success_criteria:
    score: 20
    status: "pending"
    value: ""
    gaps: "Not discussed. Need testable signals: zero glossary misses on agreed terms, proper Russian agreement, preserves HW branding conventions, stays under X chars, stays within token budget, handles API errors gracefully."
    required: true

  constraints:
    score: 60
    status: "partial"
    value: |
      - Stay on Python (n8n rejected 2026-04-22).
      - Provider: OpenAI API (pay-per-token; not Claude API — Max sub
        does not cover it; not ChatGPT Plus — no API access).
      - Use prompt caching from day one. Defer Batch API until volume
        justifies the 24h async split.
      - Locked post format (post-format.md) unaffected — only
        text generation changes.
    gaps: "Model choice (gpt-4o-mini start vs gpt-4o?), token budget per call, temperature, max_output_tokens, retry/timeout behaviour, fallback when API fails — none discussed yet."
    required: true

  testing_strategy:
    score: 0
    status: "pending"
    value: ""
    gaps: "M-sized feature with external API. Candidates: mock OpenAI SDK in unit tests (deterministic), live integration smoke-test with real API key, golden-output eval set for regression. Not yet decided."
    required: true

