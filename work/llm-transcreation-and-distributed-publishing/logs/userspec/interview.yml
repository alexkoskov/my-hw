      AC21. Manual smoke pre-deploy:
            python3 -c "from claude_transcreation import transcreate_via_claude;
                       print(transcreate_via_claude({...sample article...}))"
            должна вернуть валидный dict с RU полями за <30 секунд.
      AC22. Manual smoke post-deploy:
