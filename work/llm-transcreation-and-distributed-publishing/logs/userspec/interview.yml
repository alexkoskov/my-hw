            статьи переводятся успешно.
      EC9. Network timeout в Claude API call → обрабатывается как outage trigger.
      EC10. Manual operator publish посреди окна (через hw_review) → бот при следующей
            scheduled publication видит ru_paragraphs IS NOT NULL → skip → переходит к
            следующей. Расписание не recompute'ится.
      EC11. Claude API output слишком длинный (> 100k tokens) или malformed JSON →
            retry один раз, если опять fail → outage protocol для этой статьи.
      EC12. ANTHROPIC_API_KEY отсутствует в .env → бот при первой попытке translate
            ловит auth error → outage protocol сразу. Через 2h → Google Translate.
            Admin получает ping с инструкцией добавить ключ.
      EC13. TZ env var не задана → schedule fires в UTC time → постит в неправильное
            окно. Mitigation: в startup проверять `os.getenv("TZ")` и предупреждать в
            log если не Europe/Moscow.
    gaps: ""
    required: true

  error_scenarios:
    score: 90
    status: "complete"
    value: |
      ES1. anthropic.RateLimitError → outage protocol (ping#1, 1h grace, ping#2, 2h fallback).
      ES2. anthropic.AuthenticationError → outage protocol с hint «проверь ANTHROPIC_API_KEY».
      ES3. anthropic.APIConnectionError / network timeout → outage protocol с hint
           «возможна проблема с сетью или claude недоступен».
      ES4. anthropic.BadRequestError (malformed prompt / token limit) → log error,
           skip article, proceed to next scheduled publication. Не обращаемся в outage.
      ES5. Claude returns malformed JSON (не валидный для нашего схемы) → retry once with
           tightened prompt; если снова fail → fallback to Google Translate FOR THIS ARTICLE
           ONLY (не общая outage).
      ES6. Claude refuses to translate (safety filter): same as ES5 — fallback to Google
           для этой статьи.
      ES7. Telegraph publish_article fails (network/auth) → preserved fail-soft контракт,
           admin notify, _fallback_publish returns None.
      ES8. Telegram send_telegraph_teaser fails → preserved Decision 9 idempotency
           (telegraph_url stored before Telegram send; retry на следующем тике reuses
           the same Telegraph page).
      ES9. SQLite bot_state corruption → log error, treat as no-outage state (start fresh).
      ES10. Schedule lib раз в day скипает фетч (если bot не активен) → standard cron miss,
            ловится через operator-side observability (admin-ping не пришёл сегодня).
    gaps: ""
    required: true

  verification_strategy:
    score: 90
    status: "complete"
    value: |
      Pre-deploy (local + CI):
      - Unit tests: distribute algorithm, compute_publish_slots, outage state transitions,
        Claude API client (mocked), bot_state SQLite migrations, retry semantics.
      - Integration tests: full cron tick → schedule → publish through mocked Claude API.
      - Mock outage scenarios end-to-end (anthropic.RateLimitError, etc).
      - 470+ existing tests stay green.
      - Manual smoke: `python3 -c "from claude_transcreation import transcreate_via_claude;
        print(transcreate_via_claude(<test article>))"` — verify Claude responds with valid
        RU dict in <30 sec.

      Post-deploy on prod:
      - 12:00 МСК cron tick: admin-ping arrives in operator's chat with new-articles count
        and schedule.
      - 13:00 МСК first publication: open Telegraph page, verify quality (transcreation
        style, RU title with emoji, marker `↳ автоперевод` before footer).
      - 13:40+ subsequent posts: verify spacing, all in 13-20 window.
      - 20:00 end of window: no more posts that day. carry-over (если есть) ждёт завтра.
      - Через 7 дней: убедиться что качество сохраняется, никаких outage не было,
        Claude API стабильный, токенов хватает.

      Outage drill (опционально):
      - Временно убрать ANTHROPIC_API_KEY из .env и наблюдать ping#1 → ping#2 → fallback.
      - Восстановить ключ → next cron должен переключиться обратно на Claude.
    gaps: ""
    required: true

  ui_ux_requirements:
    score: 100
    status: "complete"
    value: "N/A — backend service. Channel teaser format and Telegraph page format already locked."
    gaps: ""
    required: false

  risks:
    score: 90
    status: "complete"
    value: |
      R1. Operator inattention to outage pings → bot тихо переходит на Google Translate
          через 2ч. Subscribers видят свежие посты в Google-качестве, не сразу ловят разницу.
          Mitigation: switch-back ping на восстановлении даёт оператору visible signal,
          что что-то было сломано. Acceptable.

      R2. Cost spike — если источник зацикливается и фетчит сотни статей в день →
          распределение всё равно cap'ится 11/день, но pending будет расти. После N дней
          backlog огромный.
          Mitigation: дополнительный admin-ping когда `len(pending) > 50` (или другой
          разумный threshold) — сигнал «pending стало большим, проверь источники».
          Закладываем как minor enhancement в этой фиче.

      R3. Claude model output drift — Anthropic меняет defaults, Claude становится
          aggressive в редакторстве (иное настроение). Mitigation: explicit version-pin
          в `ANTHROPIC_MODEL` env var (e.g. `claude-haiku-4-5-20251001`), не использовать
          alias. При обновлении моделей оператор сам решает когда мигрировать.

      R4. TZ drift / misconfiguration → cron fires в UTC время, посты в неправильное окно.
          Mitigation: startup проверяет `os.environ.get('TZ') == 'Europe/Moscow'`, иначе
          warning в log + admin-ping. Если schedule lib не поддерживает tz arg — расчёт
          UTC-equivalent в коде.

      R5. SQLite bot_state schema migration — добавление новой таблицы в существующую
          news.db. Risk: migration fails на сервере → бот crash на startup.
          Mitigation: `CREATE TABLE IF NOT EXISTS bot_state(...)` идемпотентен; покрываем
          tests/test_migration.py.

      R6. ux-guidelines.md не доехал до сервера → Claude получает пустой/дефолтный
          system prompt, перевод не по стилю.
          Mitigation: добавить файл в `deploy.sh` FILES + GitHub Actions; startup
          проверяет существование файла перед первым cron tick'ом, fail fast если нет.
    gaps: ""
    required: true

  technical_decisions:
    score: 90
    status: "complete"
    value: |
      D1. Storage для outage state — SQLite таблица `bot_state(key, value)` с
          auto-migrate. Survives container restart.
      D2. Schedule storage — in-memory only, recomputed на каждом cron tick + container
          startup. Avoids schema migration overhead для расписания.
      D3. Cron timezone — `TZ=Europe/Moscow` в env + `schedule.every().day.at("12:00")`.
          Если schedule lib не поддерживает tz arg — конвертируем на UTC в коде.
      D4. Claude model — `claude-haiku-4-5` (cost ~$3/мес). `ANTHROPIC_MODEL` env var
          для override (e.g. на Sonnet при необходимости).
      D5. ux-guidelines.md ships в deploy bundle — добавляется в `deploy.sh` FILES +
          `.github/workflows/deploy.yml` files copy.
      D6. HW glossary — keep как post-pass safety net (14 терминов). Bureaucratic regex
          (19) удаляется (Claude сам не пишет канцелярит).
      D7. Title emoji — Claude prompt ask + regex wrapper fallback (belt-and-suspenders).
      D8. 4000-char truncation — удалена везде. Telegraph принимает любой объём.
      D9. Single uniform marker `↳ автоперевод` независимо от engine.
      D10. Switch-back ping — да, один short admin-ping при восстановлении Claude API.
      D11. Hard cap on articles/day — не нужен (algorithm's floor=40 estably ограничивает 11).
      D12. Token redaction — `_TokenRedactingFilter` extends с pattern `sk-ant-...`.
    gaps: ""
    required: false

  deploy_approach:
    score: 90
    status: "complete"
    value: |
      Deploy через существующий GitHub Actions workflow (commit `22953a5` + дальнейшие).
      Дополнения для этой фичи:

      1. Operator setup (one-time, ~2 мин):
         - Зарегистрироваться на console.anthropic.com.
         - Получить API key (`sk-ant-...`).
         - На VPS: добавить в `/home/<user>/bot/.env`:
           ```
           ANTHROPIC_API_KEY=sk-ant-...
           ANTHROPIC_MODEL=claude-haiku-4-5  # optional, default
           TZ=Europe/Moscow
           ```
         - Если deploy через GitHub Actions: secret `ANTHROPIC_API_KEY` в Settings →
           Secrets and variables → Actions. Deploy workflow проксирует в .env на сервере
           (если нужно — обновляем deploy.yml для inject'а).

      2. Files deployed (FILES list update):
         - Добавить `.claude/skills/project-knowledge/references/ux-guidelines.md` в
           `deploy.sh` FILES list AND в `.github/workflows/deploy.yml` files block.

      3. Migration: `init_db()` создаёт `bot_state` table при первом запуске после deploy.

      4. Verify: первый cron tick после deploy в 12:00 МСК → admin-ping должен прийти.
         13:00 МСК первая публикация. Проверить качество.
    gaps: ""
    required: false

  manual_user_actions:
    score: 95
    status: "complete"
    value: |
      Operator-side actions:

      1. **Получить ANTHROPIC_API_KEY** (~2 мин):
         - Зарегистрироваться/войти на console.anthropic.com
         - Settings → API Keys → Create Key (default name "hwbot-prod")
         - Скопировать ключ (показывается один раз, начинается с `sk-ant-`)
         - Сохранить в безопасное место (1Password / KeePass / etc)

      2. **Top-up токенов**:
         - В консоли Anthropic → Billing → Add credits
         - Минимум $5 хватит на ~3-6 месяцев работы бота при 10 articles/day

      3. **Add API key**:
         - Если deploy ручной: SSH на VPS, добавить `ANTHROPIC_API_KEY=sk-ant-...` в
           `.env` на сервере
         - Если через GitHub Actions: добавить как secret `ANTHROPIC_API_KEY` в repo settings

      4. **Set TZ**:
         - На VPS добавить `TZ=Europe/Moscow` в `.env` (или в systemd unit/cron wrapper)

      5. **Monitor admin chat**:
         - Получать админ-пинги при cron-тиках, outage'ах, restore'ах
         - Если получишь outage ping — пополнить токены или проверить статус Anthropic
           через console.anthropic.com / status.anthropic.com

      6. **Никаких изменений в `hw_review`** — manual путь работает как раньше.
    gaps: ""
    required: false

