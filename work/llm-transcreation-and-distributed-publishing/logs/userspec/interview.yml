phase1_feature_overview:

  feature_name:
    score: 100
    status: "complete"
    value: "llm-transcreation-and-distributed-publishing"
    gaps: ""
    required: true

  feature_description:
    score: 95
    status: "complete"
    value: |
      Two-part feature replacing the current auto-fallback path:

      Part A — LLM transcreation:
      Replace Google Translate (`transcreate_text` via deep-translator) with Claude API
      using the same `ux-guidelines.md` prompt that the manual-review path uses. Auto-published
      articles will read like the manual-curated ones — живой русский, активные глаголы,
      редакторский тон. Google Translate stays as a 2h-grace fallback for Claude API outages.

      Part B — Distributed publishing schedule:
      Replace 12h-batch + overflow + idle-fallback with a daily fixed-time schedule. Cron at
      12:00 MSK fetches sources; in the daytime window 13:00–20:00 MSK, articles from pending
      are evenly distributed with a 40-min minimum interval. Max 11 posts/day; excess carries
      over to next day's window.

      Manual-review path (`hw_review`) is unchanged — operator can still take any article
      locally and publish via Claude Code session.
    gaps: ""
    required: true

  work_type:
    score: 100
    status: "complete"
    value: "feature"
    gaps: ""
    required: true

  user_problem:
    score: 95
    status: "complete"
    value: |
      Currently the bot publishes auto-fallback articles via Google Translate. Quality is
      machine-stilted Russian — passive voice, calques, awkward semantics. Subscribers see
      a mix: high-quality manual-review posts (curated by operator-side Claude) vs lower-
      quality auto posts. The gap is jarring; channel feels inconsistent.

      Additionally, the current overflow + idle-fallback model bursts 5-20 posts in a few
      minutes when the queue overflows or operator was absent — looks like spam in the feed.

      Operator wants: (1) auto path produces same quality as manual path, (2) posts arrive
      smoothly throughout the day during prime-audience window 13-20 MSK, (3) operator's
      role becomes purely supervisory (just monitor admin pings, intervene only on errors).
    gaps: ""
    required: true

  target_users:
    score: 80
    status: "complete"
    value: |
      (1) Channel subscribers — get consistent editorial-quality Russian Hot Wheels news
      delivered at predictable daytime intervals.
      (2) Operator (you) — minimal intervention required; bot self-translates, self-schedules,
      pings only on real failures (Claude API outage, no fetch from sources, etc).
    gaps: ""
    required: false

  success_criteria:
    score: 90
    status: "complete"
    value: |
      (1) Auto-published articles via Claude API are written in editorial Russian style
          per `ux-guidelines.md` (active voice, transcreation, 2-3 alt titles available).
      (2) Cron at 12:00 MSK daily — fetches sources, sends admin ping, schedules publishing.
      (3) Articles publish in 13:00–20:00 MSK window, evenly distributed: interval =
          max(420/N, 40) minutes. Max 11 posts/day; excess carry over to next day.
      (4) Claude API outage: 2 admin pings with 1h gap, 2h grace, then auto-switch to
          Google Translate fallback. Auto-switch back when Claude API recovers.
      (5) Container restart mid-window: recalculate remaining schedule for remaining time.
      (6) Manual-review path (`hw_review`) unaffected — operator can publish any article
          locally; bot skips on next tick.
      (7) Auto-marker `↳ автоперевод` appears on all auto-published Telegraph pages
          regardless of which engine translated (Claude or Google fallback).
      (8) `pending_articles.QUEUE_CAP` no longer needed — distributed schedule prevents
          unbounded growth.
    gaps: ""
    required: true

  constraints:
    score: 90
    status: "complete"
    value: |
      - Claude API integration: `anthropic` SDK in requirements.txt; `ANTHROPIC_API_KEY`
        env var (and optional `ANTHROPIC_MODEL`, default `claude-haiku-4-5` for cost).
      - Token redaction in logs: extend existing `_TokenRedactingFilter` to redact
        `ANTHROPIC_API_KEY` patterns.
      - Google Translate (`transcreate_text`) stays in code as fallback only.
      - Manual-review path untouched (no breaking changes to `hw_review` CLI).
      - Boilerplate filter, auto-marker, channel teaser format (single-line `#<source> #news`)
        all preserved.
      - Cron switches from interval-based (`schedule.every(12).hours.do(job)`) to absolute-
        time (`schedule.every().day.at("12:00")`).
      - Server timezone matters: cron must fire at 12:00 MSK regardless of container TZ.
        If container is UTC, schedule at "09:00" UTC; or set TZ env explicitly.
      - News.db schema: lean towards in-memory schedule (no migration); recalc on each
        cron tick + on container restart.
    gaps: ""
    required: true

  testing_strategy:
    score: 85
    status: "complete"
    value: |
      Feature size: M.

      Unit tests:
      - Claude API client wrapper (mocked anthropic SDK responses).
      - Distribution algorithm: N=1,4,7,10,11,15,20,30 → interval + posts_today + carry_over.
      - Container restart recalc: starting at T=14:00 with 5 unpublished — schedule for
        14:00+ should redistribute over 6h remaining.
      - Claude API outage: ping#1 fires, ping#2 after 1h, fallback after 2h.
      - Boundary: midnight rollover, single-article day (N=1), zero-article day (N=0).
      - Idempotency: container restart while a post is mid-flight (Decision 9 carryover).

      Integration tests:
      - Full cron tick → fetch (mocked) → schedule → publish via mocked Claude → DB delta.
      - Outage scenario end-to-end (mock Claude raises, verify ping count + fallback).

      No E2E (live API) tests — would burn tokens. Manual smoke against live test channel
      after deploy.

      Existing tests that must stay green: ~500 tests including Mattel parser, hw_review,
      throttle, marker, boilerplate filter.
    gaps: ""
    required: true

# ============================================================================
# Phase 2: User Experience & Scenarios (Cycle 2 — TBD)
# ============================================================================
phase2_user_experience:

  user_stories:
    score: 90
    status: "complete"
    value: |
      Story 1 (subscriber experience):
        Подписчик канала видит 1-11 постов в день в окне 13:00-20:00 МСК с интервалом
        не меньше 40 минут. Все посты — высококачественная транскреация по ux-guidelines:
        живой русский, активные глаголы, цепкие заголовки. Никаких burst'ов из 20 постов
        за 8 минут. Никакого машинного перевода с пассивами и канцеляритом.

      Story 2 (operator daily routine):
        Оператор раз в день в 12:00 МСК получает админ-пинг с количеством зафетченных
        статей и расписанием публикаций. Проверяет канал к 20:00, видит 5-11 свежих
        постов. Если есть желание — может в любой момент локально через `hw_review`
        перевести конкретную статью своим тоном (бот её скипнет). Дополнительных пингов
        нет.

      Story 3 (failure recovery — Claude API outage):
        Claude API падает посреди окна публикации (например, в 14:30). Бот пытается
        опубликовать следующую статью в 14:30 — fail. Шлёт операторe ping #1: «Claude
        API недоступен: <error>. Если кончились токены — пополни на console.anthropic.com.
        Через 1ч повтор пинга.» Текущая публикация откладывается. В 15:30 — ping #2 с
        тем же содержимым + предупреждением «через час переключусь на Google Translate».
        В 16:30 (2ч grace), если оператор не починил — переключение на Google Translate
        для ВСЕХ оставшихся публикаций сегодняшнего расписания + накопившейся отложенной.
        Когда Claude API восстановится (на следующий cron tick или при попытке очередной
        публикации) — short admin-ping «✓ Claude API recovered, switching back from Google
        Translate fallback».

      Story 4 (container restart mid-window):
        В 16:00 контейнер перезапустили (deploy / VPS reboot). Бот стартует, читает
        pending → запускает recalc для оставшегося окна (16:00 → 20:00 = 240 мин).
        Если 5 ещё не опубликованы → новый interval = 240/5 = 48 мин (>= floor=40).
        Расписание: 16:00, 16:48, 17:36, 18:24, 19:12. Уже опубликованные сегодня в
        published_articles — не трогаются.
    gaps: ""
    required: true

  acceptance_criteria:
    score: 95
    status: "complete"
    value: |
      AC1. Cron `news_bot.main()` стартует с расписанием `schedule.every().day.at("12:00")`,
           TZ=Europe/Moscow задана через env (`TZ=Europe/Moscow` в `.env`).
      AC2. После фетча на 12:00 МСК отправляется admin-ping с числом новых статей,
           размером очереди, и расписанием публикаций (timestamps).
      AC3. Алгоритм distribute_publish_slots(N, now, window_start, window_end, min_interval=40):
           - interval = max((window_end - max(now, window_start)) / N, min_interval)
           - posts_today = min(N, floor((window_end - max(now, window_start)) / interval) + 1)
           - carry_over = N - posts_today
           - returns list of N datetime publishing slots
      AC4. Публикации происходят строго в окне 13:00-20:00 МСК. Никаких публикаций до
           13:00 или после 20:00.
      AC5. Минимальный интервал между постами = 40 минут. Расчётный интервал capped at
           floor=40.
      AC6. Max 11 публикаций в день (floor=40, 7 часов окна = 420 мин, 1+10 = 11 слотов).
           Excess carry over в pending до следующего cron tick'а.
      AC7. Translation primary path: Claude API через ux-guidelines.md prompt. Возвращает
           dict {ru_title, ru_alts:[2-3], ru_subtitle, ru_paragraphs:[N], ru_blocks?}.
      AC8. Title emoji prefix: эмитится через Claude prompt (мёд) + regex wrapper как
           safety net (если Claude не вставил, regex добавляет).
      AC9. HW-глоссарий (14 терминов) применяется как post-pass safety net на ru-выходе
           Claude. Bureaucratic regex (19 правил) удалён.
      AC10. 4000-char body truncation удалена везде (Claude path и Google Translate
            fallback path). Body на Telegraph без ограничений.
      AC11. Claude API outage detection: при exception от anthropic SDK call (auth,
            rate-limit, network, server) бот переходит в outage-state.
      AC12. Outage protocol:
            - Запись `claude_api_outage_started_at` в `bot_state` SQLite.
            - Ping #1 admin: "Claude API недоступен: <error>. Решить: <hint>. Через 1ч повтор."
            - Через 1h: ping #2: "Всё ещё down. Через 1ч → Google Translate."
            - Через 2h grace: switch to Google Translate fallback (`transcreate_text`).
            - Все откладываемые + текущие публикации с этого момента — через Google.
      AC13. Auto-recovery: на каждой следующей публикации после outage бот делает первый
            проб через Claude. Если успех — переключается обратно. Шлёт admin-ping "✓
            Claude API recovered, switching back". Очищает outage state.
      AC14. Все auto-published Telegraph-страницы получают одинаковый маркер
            `↳ автоперевод` независимо от engine (Claude или Google fallback).
      AC15. Manual-review path (`hw_review`) untouched. Если оператор публикует статью
            локально — бот пропускает её на следующем тике (filter ru_paragraphs IS NOT NULL).
      AC16. Container restart mid-window: на startup бот recompute_schedule с current_time
            и оставшимся pending. Никаких дублей публикации.
      AC16b. Crash-loop guard: на startup бот читает MAX(published_at) из published_articles.
             Если последняя публикация была < 40 минут назад — пропускает текущую scheduled
             публикацию и ждёт до `last_published_at + 40min` перед следующей попыткой.
             Защищает канал от burst при многократных рестартах.
      AC16c. Outage recovery passive: при пустой очереди в момент восстановления Claude API
             бот остаётся в Google fallback режиме до следующего cron tick'а (12:00 МСК).
             На первой попытке публикации после cron tick'а бот пробует Claude, успех →
             switch-back ping. Max delay = 24ч в edge case "outage clears + empty queue".
      AC17. SQLite migration: новая таблица `bot_state(key TEXT PRIMARY KEY, value TEXT)`
            создаётся в `init_db()` при первом запуске. Idempotent (CREATE TABLE IF NOT EXISTS).
      AC18. Token redaction: ANTHROPIC_API_KEY (pattern `sk-ant-...`) добавлен в
            `_TokenRedactingFilter`.
      AC19. Legacy removed:
            - `QUEUE_CAP` env var и его use sites
            - `IDLE_TIMEOUT_HOURS` / `GRACE_WINDOW_HOURS` и их logic
            - `FALLBACK_THROTTLE_SECONDS` и skip-first patterns
            - `_overflow_fast_track` функция
            - inline idle-fallback в `job()` step 1a/1b
            - `.env.example` обновлён.
      AC20. Tests: ~28 удалены (overflow + idle + throttle), ~470 untouched, ~30 новых
