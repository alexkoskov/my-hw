    required: true

  edge_cases:
    score: 90
    status: "complete"
    value: |
      EC1. N=0 в pending после фетча → ничего не публикуется в окне; admin-ping «0 новых,
            очередь пуста».
      EC2. N=1 в pending → один пост в 13:00. Расписание [13:00].
      EC3. N=12 → cap floor=40 → 11 постов сегодня (13:00, 13:40, ..., 19:40), 1 carry over.
      EC4. N=30 → cap floor=40 → 11 сегодня, 19 carry over. На завтрашний cron tick: новый
            фетч + 19 carry over → recompute, опять max 11 today.
      EC5. Container restart в 19:50 → 4ч окна, но осталось 10 минут до 20:00. Один пост
